      return { v: p.sar, txt: 'SAR ' + C.num(p.sar), rows: p.rows.map(function (r) { return { id: r.id, v: r.u.sar, txt: 'SAR ' + C.num(r.u.sar) }; }) };
    },
    top_cause: function (t, ar) {
      var p = C.plant(t, scoped), top = null;
      for (var k in p.by) if (k !== 'Unlogged' && (!top || p.by[k] > p.by[top])) top = k;
      return { v: top ? p.by[top] : 0, txt: top ? C.reason(top, ar) : '—', sub: top ? C.dur(p.by[top], ar) : '',
               rows: Object.keys(p.by).filter(function (k) { return k !== 'Unlogged'; }).sort(function (a, b) { return p.by[b] - p.by[a]; })
                 .map(function (k) { return { label: C.reason(k, ar), v: p.by[k], txt: C.dur(p.by[k], ar) }; }) };
    },
    unlogged_h: function (t, ar) {
      var p = C.plant(t, scoped), v = (p.by.Unlogged || 0) / 60;
      return { v: v, txt: C.num(v, 1) + (ar ? ' س' : ' h'), rows: p.rows.map(function (r) { var x = (r.u.by.Unlogged || 0) / 60; return { id: r.id, v: x, txt: C.num(x, 1) + (ar ? ' س' : ' h') }; }) };
    },
    pieces: function (t) {
      var f = machinesAt(t).map(function (r) { return machineFacts(t, r); }).filter(function (x) { return x.pieces; });
      var v = f.reduce(function (s, x) { return s + x.pieces; }, 0);
      return { v: v, txt: C.num(v), rows: f.map(function (x) { return { id: x.id, v: x.pieces, txt: C.num(x.pieces) }; }) };
    },
    cycle_s: function (t) {
      var f = machinesAt(t).map(function (r) { return machineFacts(t, r); }).filter(function (x) { return x.cycle; });
      var v = f.length ? f.reduce(function (s, x) { return s + x.cycle; }, 0) / f.length : null;
      return { v: v, txt: v === null ? '—' : C.num(v) + ' s', rows: f.map(function (x) { return { id: x.id, v: x.cycle, txt: C.num(x.cycle) + ' s' }; }) };
    },
    oee: function () { return { v: null, txt: 'TBC', tbc: true, rows: [] }; },
    fpy: function (t) {
      var q = C.quality(t);
      return { v: q.fpy, txt: C.pct(q.fpy), sub: (q.tested - q.fails.length) + ' / ' + q.tested, rows: [] };
    },
    kwh: function (t) {
      var e = C.energy(t);
      return { v: e.kwh, txt: C.num(e.kwh) + ' kWh', rows: energyRows(t).map(function (x) { return { id: x.id, v: x.kwh, txt: C.num(x.kwh) + ' kWh' }; }) };
    },
    energy_sar: function (t) {
      var e = C.energy(t);
      return { v: e.sar, txt: 'SAR ' + C.num(e.sar), rows: energyRows(t).map(function (x) { return { id: x.id, v: x.sar, txt: 'SAR ' + C.num(x.sar, 1) }; }) };
    },
    idle_burn_sar: function (t) {
      var e = C.energy(t);
      return { v: e.standbySar, txt: 'SAR ' + C.num(e.standbySar, 1), rows: energyRows(t).map(function (x) { return { id: x.id, v: x.idleSar, txt: 'SAR ' + C.num(x.idleSar, 1) }; }) };
    },
    idle_burn_kwh: function (t) {
      var e = C.energy(t);
      return { v: e.standbyKwh, txt: C.num(e.standbyKwh) + ' kWh', rows: energyRows(t).map(function (x) { return { id: x.id, v: x.idleK, txt: C.num(x.idleK, 1) + ' kWh' }; }) };
    },
    peak_kw: function (t, ar) { var e = C.energy(t); return { v: e.peak, txt: C.num(e.peak) + ' kW', sub: S('pg.now', ar) + ' ' + C.num(e.now) + ' kW', rows: [] }; },
    sar_per_run_h: function (t) {
      var e = C.energy(t), p = C.plant(t, null), runH = p.rows.reduce(function (s, r) { return s + r.u.run; }, 0) / 60;
      var v = runH ? e.sar / runH : null;
      return { v: v, txt: v === null ? '—' : 'SAR ' + C.num(v, 1), rows: energyRows(t).filter(function (x) { return x.sarPerRunH !== null; }).map(function (x) { return { id: x.id, v: x.sarPerRunH, txt: 'SAR ' + C.num(x.sarPerRunH, 1) }; }) };
    },
    stops_count: function (t) {
      var f = machinesAt(t).map(function (r) { return machineFacts(t, r); });
      var v = f.reduce(function (s, x) { return s + x.stops; }, 0);
      return { v: v, txt: String(v), rows: f.map(function (x) { return { id: x.id, v: x.stops, txt: String(x.stops) }; }) };
    },
    longest_stop: function (t, ar) {
      var f = machinesAt(t).map(function (r) { return machineFacts(t, r); }), w = null;
      f.forEach(function (x) { if (!w || x.longest > w.longest) w = x; });
      return { v: w ? w.longest : 0, txt: w ? C.dur(w.longest, ar) : '—', sub: w ? C.nameOf(w.id, ar) : '',
               rows: f.map(function (x) { return { id: x.id, v: x.longest, txt: C.dur(x.longest, ar) }; }) };
    },
    breakdowns: function (t) {
      var p = C.plant(t, scoped);
      return { v: p.bd, txt: String(p.bd), rows: p.rows.filter(function (r) { return r.u.bd; }).map(function (r) { return { id: r.id, v: r.u.bd, txt: String(r.u.bd) }; }) };
    },
    mttr: function (t, ar) {
      var p = C.plant(t, scoped), v = p.bd ? p.bdMin / p.bd : null;
      return { v: v, txt: v === null ? '—' : C.dur(v, ar), rows: p.rows.filter(function (r) { return r.u.bd; }).map(function (r) { return { id: r.id, v: r.u.bdMin / r.u.bd, txt: C.dur(r.u.bdMin / r.u.bd, ar) }; }) };
    },
    health_worst: function (t, ar) {
      var rows = machinesAt(t).map(function (r) { return { id: r.id, v: health(r.id) }; }).filter(function (x) { return x.v !== null; })
        .sort(function (a, b) { return a.v - b.v; });
      var w = rows[0];
      return { v: w ? w.v : null, txt: w ? w.v + ' / 100' : '—', sub: w ? C.nameOf(w.id, ar) : '',
               rows: rows.map(function (x) { return { id: x.id, v: x.v, txt: x.v + ' / 100' }; }) };
    },
    wait_h: function (t, ar) {
      var p = C.plant(t, scoped), v = (p.by['Waiting for material'] || 0) / 60;
      return { v: v, txt: C.num(v, 1) + (ar ? ' س' : ' h'), rows: p.rows.filter(function (r) { return r.u.by['Waiting for material']; })
        .map(function (r) { var x = r.u.by['Waiting for material'] / 60; return { id: r.id, v: x, txt: C.num(x, 1) + (ar ? ' س' : ' h') }; }) };
    },
    setup_h: function (t, ar) {
      var p = C.plant(t, scoped), k = 'Changeover / setup', v = (p.by[k] || 0) / 60;
      return { v: v, txt: C.num(v, 1) + (ar ? ' س' : ' h'), rows: p.rows.filter(function (r) { return r.u.by[k]; })
        .map(function (r) { var x = r.u.by[k] / 60; return { id: r.id, v: x, txt: C.num(x, 1) + (ar ? ' س' : ' h') }; }) };
    },
    viol_open: function (t, ar) {
      var v = C.violsAt(t, currentLens);
      return { v: v.length, txt: String(v.length), rows: v.map(function (x) { return { label: x.code, v: 1, txt: x.sev }; }) };
    },
    viol_closed: function (t, ar) {
      var v = C.violsClosed(t, currentLens === 'safety' || currentLens === 'security' ? currentLens : null);
      return { v: v.length, txt: String(v.length), rows: v.map(function (x) { return { label: C.zname(x.zone, ar), v: 1, txt: C.hhmm(x.close) }; }) };
    },
    viol_oldest: function (t, ar) {
      var v = C.violsAt(t, currentLens === 'safety' || currentLens === 'security' ? currentLens : null);
      if (!v.length) return { v: 0, txt: '—', rows: [] };
      var o = v.slice().sort(function (a, b) { return a.open - b.open; })[0];
      return { v: t - o.open, txt: C.dur(t - o.open, ar), sub: C.zname(o.zone, ar),
               rows: v.sort(function (a, b) { return a.open - b.open; }).map(function (x) { return { label: C.zname(x.zone, ar), v: t - x.open, txt: C.dur(t - x.open, ar) }; }) };
    },
    events_today: function (t, ar) {
      var e = C.eventsTo(t);
      return { v: e.length, txt: String(e.length), rows: e.map(function (x) { return { label: C.hhmm(x.min), v: 1, txt: C.evText(x, ar) }; }) };
    },
    devices_ok: function (t) {
      var sil = C.silentAt(t).length, n = C.data().D.machines.filter(function (m) { return m.measured; }).length + (sense('camera') && T.cameras ? T.cameras.list.length : 0);
      return { v: n - sil, txt: (n - sil) + ' / ' + n, rows: [] };
    },
    devices_silent: function (t) {
      var s = C.silentAt(t);
      return { v: s.length, txt: String(s.length), rows: s.map(function (d) { return { label: d.id, v: 1, txt: C.hhmm(d.since) }; }) };
    }
  };
  function segAt(id, t) {
    var rec = C.data().REC[id];
    if (!rec) return [0, 0, 'U'];
    for (var i = 0; i < rec.segments.length; i++) { var s = rec.segments[i]; if (t >= s[0] && t < s[1]) return s; }
    return rec.segments[rec.segments.length - 1] || [0, 0, 'O'];
  }
  function energyRows(t) {
    var E = C.data().LY.energy.by_machine;
    var rows = C.plant(t, null).rows, byId = {};
    rows.forEach(function (r) { byId[r.id] = r; });
    return E.map(function (be) {
      var r = byId[be.id] || { id: be.id, u: { run: 0, att: 0, stopS: 0, idle: 0, by: {}, util: 0, sar: 0, bd: 0, bdMin: 0 } };
      return machineFacts(t, r);
    }).filter(function (x) { return x.kwh !== null && C.inScope(x.id); });
  }

  /* the 30-day sparkline series for a metric, if it has one */
  function series(m) {
    if (!m.hist) return null;
    var v = C.hist(m.hist).filter(function (x) { return x !== null; });
    if (m.histInvert) v = v.map(function (x) { return 1 - x; });
    return v.length > 2 ? v : null;
  }

  /* ============================== the atoms ============================== */
  function spark(vals, cls) {
    if (!vals) return '';
    var w = 120, h = 30, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = (mx - mn) || 1;
    var pts = vals.map(function (v, i) { return (i / (vals.length - 1) * w).toFixed(1) + ',' + (h - 3 - (v - mn) / span * (h - 6)).toFixed(1); });
    var last = pts[pts.length - 1].split(',');
    return '<svg class="spk ' + (cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline class="spkA" points="0,' + h + ' ' + pts.join(' ') + ' ' + w + ',' + h + '"/>' +
      '<polyline class="spkL" pathLength="1" points="' + pts.join(' ') + '"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.4"/></svg>';
  }
  function statusTag(st, ar) {
    if (st === 'example') return '<em class="ktTag ex">' + S('ui.example', ar) + '</em>';
    if (st === 'scenario') return '<em class="ktTag sc">' + S('pg.scenario', ar) + '</em>';
    if (st === 'tbc') return '<em class="ktTag tb">TBC</em>';
    return '';
  }

  /* a KPI tile. Every one is a button: pressing it opens where the number comes from. */
  function tile(id, t, ar, money) {
    var m = Mx[id];
    if (!m) return '';
    if (m.money && !money) return '';                     /* the money rule, before anything else */
    var lock = opensWith(m.needs);
    if (lock) {
      return '<button class="kt lk" data-metric="' + id + '"><span class="ktL">' + L(m.label, ar) + '</span>' +
        '<b class="ktV">🔒</b><em class="ktOpen">' + S('pg.opens-with', ar) + ' <u>' + modelName(lock, ar) + '</u></em></button>';
    }
    var r = F[id] ? F[id](t, ar) : { txt: '—' };
    var sp = series(m), d = '';
    if (sp && r.v !== null && r.v !== undefined && typeof r.v === 'number') {
      var avg = sp.reduce(function (s, v) { return s + v; }, 0) / sp.length, H = C.data().H;
      /* compare like with like: a daily total against the 30-day DAILY average, scaled to how
         much of the day has gone, so 10:00 is not compared with a whole day */
      var frac = Math.max(0.05, t / C.data().DAY), isRate = m.unit === '%';
      var ref = isRate ? avg : avg * frac;
      if (ref) {
        var dv = (r.v - ref) / Math.abs(ref), good = m.better === 'down' ? dv < 0 : dv > 0;
        if (Math.abs(dv) >= 0.02) d = '<em class="ktD ' + (good ? 'up' : 'dn') + '">' + (dv > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(dv) * 100) + '% ' + S('pg.vs-30d', ar) + '</em>';
        else d = '<em class="ktD fl">≈ ' + S('pg.vs-30d', ar) + '</em>';
      }
    }
    return '<button class="kt" data-metric="' + id + '"><span class="ktL">' + L(m.label, ar) + statusTag(m.status, ar) + '</span>' +
      '<b class="ktV"><bdi>' + r.txt + '</bdi></b>' + (r.sub ? '<span class="ktS"><bdi>' + r.sub + '</bdi></span>' : '') + d +
      spark(sp) + '<i class="ktWhy">' + S('pg.where-from', ar) + ' ›</i></button>';
  }

  /* ============================== the hero charts ============================== */
  var DAYM = 840;
  function axis(ar) {
    var out = '<div class="gAxis">';
    for (var h = 7; h <= 21; h += 2) out += '<span style="' + (ar ? 'right' : 'left') + ':' + ((h - 7) * 60 / DAYM * 100).toFixed(2) + '%">' + (h < 10 ? '0' : '') + h + ':00</span>';
    return out + '</div>';
  }
  function legendKeys(keys, ar) {
    var LBL = { run: ['Running', 'تعمل'], idle: [sense('tablet') ? 'Idle, no reason' : 'Not running - reason needs the tablet', sense('tablet') ? 'خاملة بلا سبب' : 'لا تعمل — السبب يحتاج اللوح'],
                fault: ['Breakdown', 'عطل'], setup: ['Changeover', 'تبديل'], wait: ['Waiting', 'انتظار'], noop: ['No operator', 'بلا مشغّل'],
                na: ['Not reporting', 'لا يرسل'], off: ['Off', 'مطفأة'] };
    return '<div class="gLeg">' + keys.map(function (k) { return '<span><i style="background:' + C.css(k) + '"></i>' + L(LBL[k], ar) + '</span>'; }).join('') + '</div>';
  }

  var HERO = {
    /* OPERATIONS: every scored machine's day as a strip, the now-line moving across them. The
       one picture a plant manager reads in three seconds: where the red and the blue are. */
    /* EVERY MACHINE'S DAY, AND WHAT IT ADDS UP TO.
       Jamal, 25 Nov 2026: "I want each machine's utilisation - out of the working hours that
       have actually run so far." So the row no longer ends in a bare percentage: it carries
       the two hours the percentage is made of (ran / attended so far today) and, where the
       record sets one, the machine's own target with the gap to it. A percentage with no
       denominator is the kind of number a factory manager stops believing at 10 a.m. */
    gantt: function (t, ar, sel) {
      var rows = machinesAt(t).slice();
      if (sel && currentLens === 'operator') rows = rows.filter(function (r) { return r.id === sel; });
      rows.sort(function (a, b) { return a.u.util - b.u.util; });
      var keys = sense('tablet') ? ['run', 'fault', 'setup', 'wait', 'noop', 'idle', 'na'] : ['run', 'idle', 'na'];
      var H = C.data().H, run = 0, att = 0;
      rows.forEach(function (r) { run += r.u.run; att += r.u.att; });
      return '<div class="hero gantt">' + legendKeys(keys, ar) + axis(ar) +
        rows.map(function (r) {
          var tg = H && H.target ? H.target[r.id] : null, gap = tg ? r.u.util - tg : null;
          var cls = gap === null ? '' : gap >= 0 ? ' ok' : gap > -0.1 ? ' near' : ' low';
          return '<div class="grow" data-m="' + r.id + '"><span class="gName">' + C.nameOf(r.id, ar) + '</span>' +
            '<div class="gBar">' + C.strip(C.data().REC[r.id], t) + '</div>' +
            '<bdi class="gPct' + cls + '">' + C.pct(r.u.util) +
            '<em>' + C.num(r.u.run / 60, 1) + ' / ' + C.num(r.u.att / 60, 1) + (ar ? ' س' : ' h') +
            (tg ? ' · ' + S('pg.target', ar) + ' ' + C.pct(tg) : '') + '</em></bdi></div>';
        }).join('') +
        '<div class="bFoot">' + S('pg.util-foot', ar, { u: C.pct(att ? run / att : 0), r: C.num(run / 60, 1), a: C.num(att / 60, 1) }) + '</div></div>';
    },
    /* OWNER / LEAN: where the attended machine-hours went - one bar, and below it the split. With
       the tablet it splits by cause and carries the riyals; without it, it says honestly that the
       not-running time has no reason yet. */
    hours: function (t, ar, sel, money) {
      var p = C.plant(t, scoped), tot = p.att || 1, parts = [{ k: 'run', min: p.run, label: ar ? 'تعمل وتنتج' : 'Running' }];
      if (sense('tablet')) {
        var g = {};
        for (var r in p.by) { var w = C.owner(r); g[w[0]] = g[w[0]] || { min: 0, sar: 0, col: w[1], key: w[0] }; g[w[0]].min += p.by[r]; g[w[0]].sar += (p.sarBy[r] || 0); }
        Object.keys(g).sort(function (a, b) { return g[b].min - g[a].min; }).forEach(function (k) {
          parts.push({ col: g[k].col, min: g[k].min, sar: g[k].sar, label: S(g[k].key, ar) });
        });
      } else {
        parts.push({ k: 'idle', min: p.att - p.run, label: ar ? 'لا تعمل — السبب يحتاج لوح المشغّل' : 'Not running - the reason needs the operator tablet' });
      }
      var bar = parts.map(function (x) {
        return '<i class="hSeg" style="--w:' + (x.min / tot * 100).toFixed(2) + '%;background:' + C.css(x.k || x.col) + '" title="' + esc(x.label) + '"></i>';
      }).join('');
      var list = parts.map(function (x) {
        return '<div class="hRow"><i style="background:' + C.css(x.k || x.col) + '"></i><span>' + x.label + '</span>' +
          '<bdi>' + C.dur(x.min, ar) + ' · ' + Math.round(x.min / tot * 100) + '%' + (money && x.sar ? ' · SAR ' + C.num(x.sar) : '') + '</bdi></div>';
      }).join('');
      var u = C.hist('util').filter(function (x) { return x !== null; });
      return '<div class="hero hours"><div class="hBar">' + bar + '</div><div class="hList">' + list + '</div>' +
        (u.length ? '<div class="hTrend"><span>' + S('pg.util-30d', ar) + '</span>' + spark(u, 'big') + '</div>' : '') + '</div>';
    },
    /* PRODUCTION: what each machine made, and at what real cycle */
    output: function (t, ar) {
      var f = machinesAt(t).map(function (r) { return machineFacts(t, r); }).filter(function (x) { return x.pieces; })
        .sort(function (a, b) { return b.pieces - a.pieces; });
      if (!f.length) return '<div class="hero"><div class="empty">' + S('pg.no-counted', ar) + '</div></div>';
      var mx = f[0].pieces;
      return '<div class="hero bars">' + f.map(function (x) {
        return '<div class="bRow" data-m="' + x.id + '"><span class="bName">' + C.nameOf(x.id, ar) + '</span>' +
          '<div class="bTrack"><i style="--w:' + (x.pieces / mx * 100).toFixed(1) + '%;background:' + C.css('run') + '"></i></div>' +
          '<bdi class="bVal">' + C.num(x.pieces) + ' · ' + C.num(x.cycle) + ' s · ' + C.pct(x.u.util) +
          '<em>' + C.num(x.u.run / 60, 1) + ' / ' + C.num(x.u.att / 60, 1) + (ar ? ' س' : ' h') + '</em></bdi></div>';
      }).join('') + '<div class="bFoot">' + S('pg.output-foot', ar) + '</div></div>';
    },
    /* MAINTENANCE: where to look first. A ranking, never a riyal. */
    health: function (t, ar) {
      var rows = machinesAt(t).map(function (r) { var f = machineFacts(t, r); f.h = health(r.id); return f; }).filter(function (x) { return x.h !== null; })
        .sort(function (a, b) { return a.h - b.h; });
      var H = C.data().H;
      return '<div class="hero bars">' + rows.map(function (x) {
        var col = x.h >= 80 ? C.css('run') : x.h >= 60 ? C.css('setup') : C.css('fault'), hm = H && H.machines[x.id];
        var extra = sense('tablet') && hm ? ' · MTBF ' + (hm.mtbf_h === null ? '—' : hm.mtbf_h + ' h') + ' · MTTR ' + hm.mttr + ' min'
                                         : (hm ? ' · ' + C.num(hm.stops_per_h, 1) + (ar ? ' توقف/ساعة' : ' stops/run-h') : '');
        return '<div class="bRow" data-m="' + x.id + '"><span class="bName">' + C.nameOf(x.id, ar) + '</span>' +
          '<div class="bTrack"><i style="--w:' + x.h + '%;background:' + col + '"></i></div>' +
          '<bdi class="bVal">' + x.h + ' / 100 · ' + x.stops + (ar ? ' توقف اليوم' : ' stops today') + extra + '</bdi></div>';
      }).join('') + '<div class="bFoot">' + S(sense('tablet') ? 'pg.health-foot-pro' : 'pg.health-foot-basic', ar) + '</div></div>';
    },
    /* ENERGY: every machine - kWh, riyals, what a running hour costs, what it burned doing nothing,
       and what one piece cost in power. Plus the plant's load through the day. */
    energy: function (t, ar, sel, money) {
      var rows = energyRows(t).sort(function (a, b) { return (b.kwh || 0) - (a.kwh || 0); }), mx = rows.length ? rows[0].kwh || 1 : 1;
      var e = C.energy(t), pr = C.data().LY.energy.profile, pk = Math.max.apply(null, pr), n = Math.min(pr.length, Math.floor(t / 10) + 1);
      var w = 600, h = 90, pts = pr.map(function (v, i) { return (i / (pr.length - 1) * w).toFixed(1) + ',' + (h - v / pk * (h - 8)).toFixed(1); });
      var curve = '<svg class="eCurve" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
        '<polyline class="eAll" points="' + pts.join(' ') + '"/>' +
        '<polyline class="eSoFar" pathLength="1" points="0,' + h + ' ' + pts.slice(0, n).join(' ') + ' ' + pts[n - 1].split(',')[0] + ',' + h + '"/>' +
        '<line class="eNow" x1="' + (t / DAYM * w).toFixed(1) + '" x2="' + (t / DAYM * w).toFixed(1) + '" y1="0" y2="' + h + '"/></svg>';
      var head = '<div class="eHead"><span>' + S('pg.machine', ar) + '</span><span>kWh</span>' +
        (money ? '<span>' + S('pg.sar-today', ar) + '</span><span>' + S('pg.sar-run-h', ar) + '</span><span>' + S('pg.sar-idle', ar) + '</span><span>' + S('pg.sar-piece', ar) + '</span>'
               : '<span>' + S('pg.kwh-idle', ar) + '</span>') + '</div>';
      var body = rows.map(function (x) {
        var idleShare = x.kwh ? x.idleK / x.kwh : 0;
        return '<div class="eRow" data-m="' + x.id + '"><span class="bName">' + C.nameOf(x.id, ar) + '</span>' +
          '<span class="eK"><i style="--w:' + ((x.kwh || 0) / mx * 100).toFixed(1) + '%"><u style="--w:' + (idleShare * 100).toFixed(1) + '%"></u></i><bdi>' + C.num(x.kwh) + '</bdi></span>' +
          (money ? '<bdi>' + C.num(x.sar, 1) + '</bdi><bdi>' + (x.sarPerRunH === null ? '—' : C.num(x.sarPerRunH, 1)) + '</bdi><bdi class="eIdle">' + C.num(x.idleSar, 1) + '</bdi><bdi>' + (x.sarPerPiece === null ? '—' : C.num(x.sarPerPiece, 2)) + '</bdi>'
                 : '<bdi class="eIdle">' + C.num(x.idleK, 1) + '</bdi>') + '</div>';
      }).join('');
      return '<div class="hero energy"><div class="eTop"><span>' + S('pg.load-today', ar) + ' · <bdi>' + C.num(e.now) + ' kW</bdi> ' + S('pg.now', ar) + ' · ' + S('pg.peak', ar) + ' <bdi>' + C.num(e.peak) + ' kW</bdi></span></div>' +
        curve + '<div class="eTable">' + head + body + '</div><div class="bFoot">' + S('pg.energy-foot', ar) + '</div></div>';
    },
    /* SAFETY / SECURITY: the day's events on one line, each with its camera */
    events: function (t, ar) {
      var ev = C.eventsTo(t), vs = C.violsAt(t, currentLens);
      var line = '<div class="evLine">' + ev.map(function (e) {
        return '<i class="evDot ' + (e.sev === 'hi' ? 'hi' : '') + '" data-cam="' + e.cam + '" style="' + (ar ? 'right' : 'left') + ':' + (e.min / DAYM * 100).toFixed(2) + '%" title="' + esc(C.evText(e, ar)) + '"></i>';
      }).join('') + '<u style="' + (ar ? 'right' : 'left') + ':' + (t / DAYM * 100).toFixed(2) + '%"></u></div>';
      var list = vs.map(function (v) {
        return '<div class="bRow" data-cam="' + v.cam + '"><span class="bName"><b class="vc ' + v.sev + '">' + v.code + '</b></span><span class="vTxt">' + T.tel.LF(v, 'what', ar) + '</span><bdi class="bVal">' + C.dur(t - v.open, ar) + '</bdi></div>';
      }).join('');
      return '<div class="hero events">' + axis(ar) + line + (list || '<div class="empty">' + S('pg.nothing-standing', ar) + '</div>') + '</div>';
    },
    devices: function (t, ar) {
      var s = C.silentAt(t);
      return '<div class="hero bars">' + (s.length ? s.map(function (d) {
        return '<div class="bRow"><span class="bName"><b>' + d.id + '</b></span><span class="vTxt">' + T.tel.LF(d, 'what', ar) + '</span><bdi class="bVal">' + C.hhmm(d.since) + '</bdi></div>';
      }).join('') : '<div class="empty">' + S('pg.all-reporting', ar) + '</div>') + '</div>';
    }
  };

  /* ============================== the one-sentence answer ============================== */
  function answer(lensId, t, ar, money) {
    var p = C.plant(t, scoped), e = C.energy(t), notRun = (p.att - p.run);
    function A(key, v) { return S(key, ar, v); }
    switch (lensId) {
      case 'owner':
        if (sense('tablet') && money) return A('pg.ans.owner-pro', { h: C.dur(notRun, ar), s: C.num(p.sar), p: C.pct(1 - p.util) });
        return A('pg.ans.owner-basic', { h: C.dur(notRun, ar), p: C.pct(1 - p.util), e: C.num(e.standbySar, 1) });
      case 'ops': {
        var st = F.stopped_now(t, ar).v, tc = sense('tablet') ? F.top_cause(t, ar) : null;
        return tc && tc.v ? A('pg.ans.ops-pro', { n: st, c: tc.txt, d: tc.sub }) : A('pg.ans.ops-basic', { n: st, h: C.dur(notRun, ar) });
      }
      case 'prod': { var pc = F.pieces(t); return A('pg.ans.prod', { n: C.num(pc.v), u: C.pct(p.util) }); }
      case 'maint': { var hw = F.health_worst(t, ar); return hw.v === null ? '' : A('pg.ans.maint', { m: hw.sub, s: hw.v }); }
      case 'energy': return money ? A('pg.ans.energy', { k: C.num(e.kwh), s: C.num(e.sar), i: C.num(e.standbySar, 1) })
                                  : A('pg.ans.energy-nomoney', { k: C.num(e.kwh), i: C.num(e.standbyKwh) });
      case 'safety': case 'security': { var v = C.violsAt(t, lensId).length; return A('pg.ans.safety', { v: v, e: C.eventsTo(t).length }); }
      default: return '';
    }
  }

  /* ============================== the page ============================== */
  var currentLens = null;
  function header(lens, ar, R0, st) {
    var q = R.lenses[lens.id] || {}, model = T.pkg ? T.pkg.label(undefined, ar) : '';
    return '<div class="pgQ"><div class="pgQl"><div class="pgLens">' + T.tel.LP(lens, ar) + '<em>' + lens.tier + (lens.chip ? ' · ' + lens.chip : '') + '</em>' +
      '<em class="rtag">' + S(R0.key, ar) + '</em><em class="mtag">' + model + '</em></div>' +
      '<h2 class="pgQuestion">' + L(q.q, ar) + '</h2>' + (st ? '<p class="pgAnswer">' + st + '</p>' : '') + '</div></div>';
  }

  T.pages = {
    has: function (lensId) { return !!(R && R.lenses[lensId]); },
    flagship: function (lensId) { return !!(R && R.lenses[lensId] && R.lenses[lensId].flagship); },
    registry: function () { return R; },
    metric: function (id) { return Mx[id]; },
    /* the value a KPI has, for the harness's consistency check */
    value: function (id, t, ar) { return F[id] ? F[id](t, ar) : null; },
    /* the lens's ONE-SENTENCE answer to its own question. Exported 25 Nov 2026 for the phone
       app, which lays the page out differently and must not write a second sentence of its
       own - the words a lens answers with are the same on every screen. */
    answer: function (lensId, t, ar, money) {
      if (!C) T.pages.init();
      var prev = currentLens, prevScope = scoped;
      currentLens = lensId; scoped = null;
      var out = answer(lensId, t, ar, money);
      currentLens = prev; scoped = prevScope;
      return out;
    },
    /* is this figure out of reach in the running model, and what opens it */
    opensWith: function (needs) { if (!C) T.pages.init(); return opensWith(needs); },
    /* ONE MACHINE, every fact the page knows about it - so the advisor answers "tell me about
       the powder coating line" from the same arithmetic as the page and never its own. */
    facts: function (t, id) {
      if (!C) T.pages.init();
      var r = C.plant(t, null).rows.filter(function (x) { return x.id === id; })[0];
      if (!r) return null;
      var f = machineFacts(t, r);
      f.state = C.kindOf(segAt(id, t)); f.seg = segAt(id, t); f.health = health(id);
      f.target = (C.data().H && C.data().H.target) ? C.data().H.target[id] : null;
      return f;
    },
    init: function () {
      C = T.dash.core; R = T.data.metrics; Mx = R.metrics;
    },
    /* the top of every live page: question, answer, KPI row, hero. dash.page() calls this and
       then decides what goes underneath. */
    top: function (lens, ar, t, sel, R0, live) {
      if (!C) T.pages.init();
      currentLens = lens.id; scoped = lens.scoped ? function (id) { return C.inScope(id); } : null;
      var q = R.lenses[lens.id]; if (!q) return '';
      var money = !!lens.money;
      var tiles = q.kpis.map(function (id) { return tile(id, t, ar, money); }).join('');
      var hero = live && HERO[q.hero] ? '<section class="pan heroPan"><h3>' + S('pg.hero.' + q.hero, ar) + '</h3>' + HERO[q.hero](t, ar, sel, money) + '</section>' : '';
      return header(lens, ar, R0, live ? answer(lens.id, t, ar, money) : '') + '<div class="ktRow">' + tiles + '</div>' + hero;
    },
    /* THE PROVENANCE DRAWER - "where does this number come from". */
    prov: function (id, t, ar, lensId, money) {
      if (!C) T.pages.init();
      var m = Mx[id]; if (!m) return '';
      var lock = opensWith(m.needs);
      var SN = { ct: ['Current clamp', 'ملقط التيار'], meter: ['Energy meter', 'عدّاد الطاقة'], prox: ['Proximity switch', 'حساس الاقتراب'], temp: ['Temperature & humidity', 'الحرارة والرطوبة'],
                 history: ['30-day record', 'سجل 30 يوماً'], tablet: ['Operator tablet', 'لوح المشغّل'], camera: ['Cameras', 'الكاميرات'], rtls: ['People & forklift tags', 'وسوم الأشخاص والرافعات'], predict: ['Prediction', 'التنبؤ'] };
      var chips = m.needs.map(function (k) { var ok = sense(k); return '<span class="pvChip ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '🔒 ') + L(SN[k], ar) + (ok ? '' : ' — ' + modelName(OPENS[k], ar)) + '</span>'; }).join('');
      var where = Object.keys(R.lenses).filter(function (l) { return R.lenses[l].kpis.indexOf(id) >= 0; })
        .map(function (l) { var lz = T.data.lenses.lenses.filter(function (x) { return x.id === l; })[0]; return lz ? T.tel.LP(lz, ar) : l; });
      var out = '<div class="pvHead"><span>' + S('pg.where-from', ar) + '</span><h3>' + L(m.label, ar) + '</h3>';
      if (!lock && F[id] && !(m.money && !money)) {
        currentLens = lensId;
        var r = F[id](t, ar);
        out += '<div class="pvVal"><bdi>' + r.txt + '</bdi>' + statusTag(m.status, ar) + '</div></div>';
        out += '<h4>' + S('pg.how', ar) + '</h4><p class="pvF">' + L(m.formula, ar) + '</p>';
        out += '<h4>' + S('pg.sensors', ar) + '</h4><div class="pvChips">' + chips + '</div>';
        var rows = (r.rows || []).filter(function (x) { return x.v !== null && x.v !== undefined; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 10);
        if (rows.length) {
          var mx = Math.max.apply(null, rows.map(function (x) { return Math.abs(x.v) || 0; })) || 1;
          out += '<h4>' + S('pg.behind-it', ar) + '</h4>' + rows.map(function (x) {
            return '<div class="pvRow"' + (x.id ? ' data-m="' + x.id + '"' : '') + '><span>' + (x.id ? C.nameOf(x.id, ar) : x.label) + '</span>' +
              '<i style="--w:' + (Math.abs(x.v) / mx * 100).toFixed(1) + '%"></i><bdi>' + x.txt + '</bdi></div>';
          }).join('');
        }
        if (/kwh|energy|idle|sar_per/.test(id)) out += '<p class="pvNote">' + S('pg.energy-demo-note', ar) + '</p>';
      } else {
        out += '<div class="pvVal lk">🔒</div></div><h4>' + S('pg.how', ar) + '</h4><p class="pvF">' + L(m.formula, ar) + '</p>' +
          '<h4>' + S('pg.sensors', ar) + '</h4><div class="pvChips">' + chips + '</div>' +
          (lock ? '<p class="pvOpen">' + S('pg.opens-with', ar) + ' <b>' + modelName(lock, ar) + '</b></p>' : '');
      }
      out += '<h4>' + S('pg.same-figure-on', ar) + '</h4><p class="pvF">' + where.join(' · ') + '</p>';
      out += '<p class="pvNote">' + S('pg.one-source', ar) + '</p>';
      return out;
    }
  };
})(window.TELMERA);
</script>

window.TELMERA.profile = {"screen":"sc-laptop","kpiMax":7,"nav":"side"};</script>
<script>/* ui.js - the TELMERA app, on every screen it runs on.
 *
 * ONE RENDERER, MANY SCREENS. The phone and the laptop are the SAME file with a different
 * PROFILE (window.TELMERA.profile, written by build_app.mjs out of the design system):
 *   screen  the design-system screen class - sc-phone or sc-laptop - which carries the font
 *           sizes, the touch targets and the spacing for that viewing distance
 *   kpiMax  how many figures may sit on one screen, from tokens.json type.screens[*].max_kpi
 *   nav     'bottom' for a thumb, 'side' for a mouse
 * Adding a third screen is a profile, not a fork. Nothing below branches on "phone" by name.
 *
 * WHAT IT IS: the screen layer of the design system. Not a second product, and not a second
 * set of numbers. Every figure, every sentence and every recommendation on these screens is
 * asked of dash.js / pages.js, which are the same files the laptop dashboard and the in-plant
 * screens read. If a figure is wrong here it is wrong everywhere, and it is fixed there.
 *
 * WHERE THE PIECES LIVE, so a change is one edit and never a hunt:
 *   who sees what, and in what order ....... telmera/app/desks.json      (the IA, as data)
 *   which figures answer which question .... telmera/data/metrics.json
 *   what each model sells ................... telmera/data/packages.json
 *   every word on screen .................... telmera/i18n.json + app/app_i18n.json
 *   every colour, size, radius, motion ...... 12_DESIGN_SYSTEM/tokens.json
 *   how it is assembled ..................... 04_DEMO_FACTORY/build_app.mjs
 * This file holds LAYOUT and NAVIGATION. Nothing else belongs in it.
 */
window.TELMERA = window.TELMERA || {};
(function (T) {
  'use strict';

  var lang = 'ar', IA = null, LENS = {}, booted = false, route = { k: 'home' }, showAll = false;
  function P() { return T.profile || { screen: 'sc-phone', kpiMax: 3, nav: 'bottom' }; }
  function wide() { return P().nav === 'side'; }

  function S(k, v) { return T.i18n(k, lang === 'ar', v); }
  function ar() { return lang === 'ar'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function $(id) { return document.getElementById(id); }
  function lensOf(id) { return LENS[id] || null; }
  function lensName(id) { var l = lensOf(id); return l ? ((ar() ? l.ar : l.en) || l.id) : id; }
  function lensQ(id) { var m = reg().lenses[id]; return m && m.q ? (ar() ? (m.q[1] || m.q[0]) : m.q[0]) : ''; }
  function reg() { return T.data.metrics; }
  function pkgState(id) { var p = T.pkg && T.pkg.lens ? T.pkg.lens(id) : null; return (p && p.state) || 'full'; }
  function deskOf(id) {
    for (var i = 0; i < IA.desks.length; i++) {
      if (IA.desks[i].id === id) return IA.desks[i];
      if ((IA.desks[i].children || []).indexOf(id) >= 0) return IA.desks[i];
    }
    return null;
  }

  /* ---------------- the live strip ---------------- */
  function nowStrip() {
    var t = T.day.t, c = T.dash.core.plant(t).counts || {};
    /* `na` is NOT MEASURED and stays outside every total: an unmeasured bench is not a stopped
       machine, and the two are never added together (dash.js, the four data rules). */
    return '<span class="dot"></span><s>' + S('app.running-of', { run: c.run || 0, all: (c.run || 0) + (c.idle || 0) }) + '</s>'
         + '<span>' + S('app.as-of', { time: T.dash.core.hhmm(t) }) + '</span>';
  }

  /* ---------------- home ---------------- */
  function tile(d) {
    var st = pkgState(d.id);
    var head = '<span class="gl" aria-hidden="true">' + d.glyph + '</span><span class="ti">' + esc(lensName(d.id)) + '</span>'
             + (st === 'locked' ? '<span class="tag">' + S('app.locked-in-model') + '</span>'
             : st === 'partial' ? '<span class="tag">' + S('app.partial-in-model') + '</span>' : '');
    var big = st === 'locked'
      ? '<b class="big">—<span>' + S('app.locked-in-model') + '</span></b>'
      : '<b class="big">' + T.dash.headline(lensOf(d.id), lang, null) + '</b>';
    var kids = (d.children || []).length
      ? '<span class="kids">' + d.children.map(function (k) {
          return '<span class="kid" data-state="' + pkgState(k) + '">' + esc(lensName(k)) + '</span>'; }).join('') + '</span>'
      : '';
    return '<button class="tile" data-go="' + d.id + '" data-state="' + st + '">'
         + '<span class="hd">' + head + '</span><span class="q">' + esc(lensQ(d.id)) + '</span>' + big + kids + '</button>';
  }
  function homeHTML() {
    return IA.desks.map(tile).join('')
      + '<button class="tile plant" data-go="plant"><span class="hd"><span class="gl" aria-hidden="true">'
      + IA.plant.glyph + '</span><span class="ti">' + S('app.plant') + '</span></span>'
      + '<span class="q">' + S('app.plant-sub') + '</span>'
      + '<span class="kids">' + legendHTML().replace(/class="lg"/, 'class="lg mini"') + '</span></button>';
  }

  /* ---------------- one figure ---------------- */
  function kpi(id, money, wide) {
    var m = T.pages.metric(id);
    if (!m) return '';
    if (m.money && !money) return '';                 /* the money rule, before anything else */
    var lock = T.pages.opensWith(m.needs);
    var label = esc(m.label[ar() ? 1 : 0]);
    if (lock) {
      return '<button class="kpi' + (wide ? ' wide' : '') + '" data-locked="1" data-metric="' + id + '">'
           + '<span class="kl">' + label + '</span><span class="kv">—</span>'
           + '<span class="ks">' + S('app.opens-with') + ' ' + esc(lock) + '</span></button>';
    }
    var r = T.pages.value(id, T.day.t, ar()) || { txt: '—' };
    return '<button class="kpi' + (wide ? ' wide' : '') + '" data-metric="' + id + '">'
         + '<span class="kl">' + label + '</span>'
         + '<span class="kv num"><bdi>' + r.txt + '</bdi></span>'
         + (r.sub ? '<span class="ks"><bdi>' + r.sub + '</bdi></span>' : '') + '</button>';
  }

  /* ---------------- a desk or a lens ---------------- */
  function lensHTML(id) {
    var l = lensOf(id), q = reg().lenses[id], st = pkgState(id), money = !!(l && l.money);
    if (!l || !q) return '<div class="pg"><p class="pga">—</p></div>';
    if (st === 'locked') {
      return '<div class="pg"><div class="pgq">' + esc(lensQ(id)) + '</div>'
           + T.dash.lockPanel(l, ar(), T.pkg.lens(id)) + '</div>';
    }
    var kpis = q.kpis.slice();
    var hero = kpis.shift();
    var hm = T.pages.metric(hero), hv = T.pages.value(hero, T.day.t, ar()) || { txt: '—' };
    var heroHTML = '<button class="hero" data-metric="' + hero + '">'
      + '<span class="hl">' + esc(hm.label[ar() ? 1 : 0]) + '</span>'
      + '<span class="hv num"><bdi>' + hv.txt + '</bdi></span>'
      + (hv.sub ? '<span class="hs"><bdi>' + hv.sub + '</bdi></span>' : '') + '</button>';

    /* The screen's own figure budget: the hero counts as one, so the grid gets kpiMax - 1.
       The rest are never deleted, they fold. (tokens.json type.screens[*].max_kpi) */
    var room = Math.max(1, P().kpiMax - 1);
    var shown = showAll ? kpis : kpis.slice(0, room);
    var grid = '<div class="kpis">' + shown.map(function (k) { return kpi(k, money); }).join('') + '</div>';
    var more = kpis.length > room
      ? '<button class="moreBtn" data-more="1">' + S(showAll ? 'app.less' : 'app.more') + '</button>' : '';

    var d = deskOf(id), kids = '';
    if (d && d.id === id && (d.children || []).length) {
      kids = '<h3 class="sec">' + S('app.under-desk') + '</h3><div class="kids">'
           + d.children.map(function (k) {
               return '<button class="kid" data-go="' + k + '" data-state="' + pkgState(k) + '">' + esc(lensName(k)) + '</button>';
             }).join('') + '</div>';
    }
    var advice = T.dash.core.advice(T.day.t, ar(), id, money, 3) || '';
    return '<div class="pg">'
      + '<div class="pgq">' + esc(lensQ(id)) + '</div>'
      + '<p class="pga">' + (T.pages.answer(id, T.day.t, ar(), money) || '') + '</p>'
      + heroHTML + grid + more + kids
      + '<h3 class="sec">' + S('app.what-to-do') + '</h3>'
      + '<div class="adv">' + (advice || S('app.no-advice')) + '</div>'
      + '</div>';
  }

  /* ---------------- the plant: a plan drawn from layout.json ----------------
     Nothing here is a picture. Every rectangle is an asset in layout.json at its real metres,
     painted in the state dash.js says it is in at this minute. A thumb screen gets the hall
     turned on its side (72 m runs down the phone); a mouse screen gets it as drawn. */
  var STVAR = { run: 'run', idle: 'idle', setup: 'setup', wait: 'waitwork', noop: 'waitop', fault: 'fault', na: 'nomeas', off: 'off' };
  function stateAt(id) {
    if (!T.pages.facts(T.day.t, id)) return 'na';            /* no sensor in this model: grey, never "stopped" */
    return T.dash.stateOf(id, T.day.t) || 'na';
  }
  function planHTML() {
    var L = T.layout, HW = L.hall.w, HH = L.hall.h, tall = !wide();
    function R(o) {            /* plan metres (origin bottom-left, y up) -> screen box */
      return tall ? { x: HH - (o.y + o.h), y: o.x, w: o.h, h: o.w }
                  : { x: o.x, y: HH - (o.y + o.h), w: o.w, h: o.h };
    }
    function rect(o, cls, extra) { var r = R(o); return '<rect class="' + cls + '" x="' + r.x.toFixed(2) + '" y="' + r.y.toFixed(2) + '" width="' + r.w.toFixed(2) + '" height="' + r.h.toFixed(2) + '"' + (extra || '') + '/>'; }
    var out = '<svg class="plan" viewBox="-1 -1 ' + ((tall ? HH : HW) + 2) + ' ' + ((tall ? HW : HH) + 2) + '" role="img" aria-label="' + esc(S('app.plant')) + '">';
    out += rect({ x: 0, y: 0, w: HW, h: HH }, 'pHall');
    L.zones.forEach(function (z) {
      var r = R(z);
      out += rect(z, 'pZone') + '<text class="pZt" x="' + (r.x + 0.6).toFixed(2) + '" y="' + (r.y + 1.5).toFixed(2) + '">' + esc(T.dash.core.zname(z.id, ar())) + '</text>';
    });
    L.aisles.forEach(function (a) { out += rect(a, 'pAisle'); });
    L.assets.forEach(function (m) {
      var k = stateAt(m.id), r = R(m);
      out += '<g class="pM" data-machine="' + m.id + '" data-k="' + k + '">'
           + rect(m, 'pMr', ' rx="0.35" style="fill:var(--st-' + STVAR[k] + ')"')
           + '<rect class="pHit" x="' + (r.x - 0.6).toFixed(2) + '" y="' + (r.y - 0.6).toFixed(2) + '" width="' + (r.w + 1.2).toFixed(2) + '" height="' + (r.h + 1.2).toFixed(2) + '"/>'
           /* a label must FIT its machine: the full id where there is room, the number alone on a
              narrow one, nothing on a sliver - the tap target and the card carry the name there */
           + (r.w >= 3.2 && r.h >= 1.6 ? '<text class="pMt" x="' + (r.x + r.w / 2).toFixed(2) + '" y="' + (r.y + r.h / 2 + 0.4).toFixed(2) + '">' + m.id + '</text>'
              : r.w >= 1.5 && r.h >= 1.5 ? '<text class="pMt sm" x="' + (r.x + r.w / 2).toFixed(2) + '" y="' + (r.y + r.h / 2 + 0.32).toFixed(2) + '">' + m.id.replace(/^\D+/, '') + '</text>' : '')
           + '</g>';
    });
    return out + '</svg>';
  }
  function legendHTML() {
    var c = {}, order = ['run', 'idle', 'setup', 'wait', 'noop', 'fault', 'na', 'off'];
    T.layout.assets.forEach(function (m) { var k = stateAt(m.id); c[k] = (c[k] || 0) + 1; });
    return '<div class="lg">' + order.filter(function (k) { return c[k]; }).map(function (k) {
      return '<span class="lgi"><i style="background:var(--st-' + STVAR[k] + ')"></i><b class="num">' + c[k] + '</b> '
           + esc(T.dash.core.stateLabel(k, ar())) + '</span>'; }).join('') + '</div>';
  }
  function plantHTML() {
    var t = T.day.t;
    return '<div class="pg plantPg">'
      + '<p class="pga">' + S('app.plant-sub') + '. ' + S('app.plan-hint') + '</p>'
      + '<div class="tbar"><span>' + S('app.time') + '</span><b class="num" id="tNow">' + T.dash.core.hhmm(t) + '</b>'
      + '<input type="range" data-time min="0" max="839" step="1" value="' + Math.round(t) + '" aria-label="' + esc(S('app.time')) + '"></div>'
      + '<div id="legend">' + legendHTML() + '</div>'
      + '<div class="planWrap" id="planWrap">' + planHTML() + '</div>'
      + '<p class="pga soon">' + S('app.view-3d') + '</p></div>';
  }
  /* one machine, every fact - asked of pages.js, the same arithmetic the laptop page uses.
     NO RIYAL HERE: the plant is seen by everyone, so it carries no figure that needs the
     financial permission. */
  function machineHTML(id) {
    var C = T.dash.core, f = T.pages.facts(T.day.t, id), k = stateAt(id);
    var head = '<div class="mState"><i style="background:var(--st-' + STVAR[k] + ')"></i>' + esc(C.stateLabel(k, ar())) + '</div>';
    if (!f) return head + '<p class="pga">' + S('app.m-unmeasured') + '</p>';
    function row(l, v) { return v === null || v === undefined ? '' : '<div class="mRow"><span>' + S(l) + '</span><b class="num"><bdi>' + v + '</bdi></b></div>'; }
    return head
      + row('app.m-util', C.pct(f.u.util))
      + row('app.m-ran', C.dur(f.u.run, ar()) + ' / ' + C.dur(f.u.att, ar()))
      + row('app.m-pieces', f.pieces ? C.num(f.pieces) : null)
      + row('app.m-kwh', f.kwh === null ? null : C.num(f.kwh, 1) + ' kWh')
      + row('app.m-stops', f.stops)
      + row('app.m-longest', f.longest ? C.dur(f.longest, ar()) : null);
  }
  function openMachine(id) {
    $('provTitle').textContent = id + ' · ' + T.dash.core.nameOf(id, ar());
    $('provBody').innerHTML = machineHTML(id);
    $('prov').setAttribute('data-open', '1');
  }

  /* the laptop rail: on a mouse screen nothing should be two clicks away */
  function railHTML() {
    var out = '<button class="railItem" data-nav="home"' + (route.k === 'home' ? ' aria-current="page"' : '') + '>'
            + S('app.home') + '</button>';
    IA.desks.forEach(function (d) {
      var on = route.k === 'lens' && route.id === d.id;
      out += '<button class="railItem desk" data-go="' + d.id + '" data-state="' + pkgState(d.id) + '"'
           + (on ? ' aria-current="page"' : '') + '><span class="gl">' + d.glyph + '</span>' + esc(lensName(d.id)) + '</button>';
      (d.children || []).forEach(function (k) {
        var kon = route.k === 'lens' && route.id === k;
        out += '<button class="railItem kidItem" data-go="' + k + '" data-state="' + pkgState(k) + '"'
             + (kon ? ' aria-current="page"' : '') + '>' + esc(lensName(k)) + '</button>';
      });
    });
    out += '<button class="railItem desk" data-go="plant"' + (route.k === 'plant' ? ' aria-current="page"' : '') + '>'
         + '<span class="gl">' + IA.plant.glyph + '</span>' + S('app.plant') + '</button>';
    return out;
  }

  /* ---------------- render ---------------- */
  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = ar() ? 'rtl' : 'ltr';
    /* EVERY word on the page follows the language - the fixed chrome too. An element marked
       data-s="key" is filled from the dictionary here, so the template carries no text at all. */
    Array.prototype.forEach.call(document.querySelectorAll('[data-s]'), function (n) { n.textContent = S(n.getAttribute('data-s')); });
    var home = route.k === 'home';
    if ($('rail')) $('rail').innerHTML = railHTML();
    $('back').style.display = (home || wide()) ? 'none' : '';
    /* the wordmark IS the brand: weight 600, tracking .14em, the T in the accent
       (05_BRAND/build_brand_assets.py SPEC). The one place the accent is not a button. */
    if (home || wide()) $('title').innerHTML = '<span class="wm"><b>T</b>ELMERA</span>';
    else $('title').textContent = route.k === 'plant' ? S('app.plant') : lensName(route.id);
    $('now').innerHTML = home ? nowStrip() : '';
    $('tiles').innerHTML = home ? homeHTML() : (route.k === 'plant' ? plantHTML() : lensHTML(route.id));
    $('note').textContent = home ? S('app.stage-note') : '';
    var id = T.pkg ? T.pkg.id() : '', tier = T.pkg ? T.pkg.tier() : '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-model]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-model') === id &&
        (b.getAttribute('data-model') !== 'machine' || b.getAttribute('data-tier') === tier)));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-nav') === (home ? 'home' : route.k) ? 'page' : 'false');
    });
  }

  function go(k, id) { route = { k: k, id: id }; showAll = false; render(); try { window.scrollTo(0, 0); } catch (e) {} }

  /* the provenance sheet: every figure opens where it came from. The council's rule, and the
     answer to "I do not know where this number is from" - on the phone as on the laptop. */
  function openProv(metricId) {
    var lensId = route.k === 'lens' ? route.id : 'ops';
    var l = lensOf(lensId);
    $('provBody').innerHTML = T.pages.prov(metricId, T.day.t, ar(), lensId, !!(l && l.money));
    $('provTitle').textContent = S('app.where-from');
    $('prov').setAttribute('data-open', '1');
  }

  /* ---------------- iOS ---------------- */
  function standalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
  function isIOS() { var u = navigator.userAgent || ''; return /iPad|iPhone|iPod/.test(u) || (/Mac/.test(u) && navigator.maxTouchPoints > 1); }

  T.app = {
    boot: function (ia) {
      if (booted) return; booted = true;
      IA = ia;
      /* the language: ?lang=en in the address wins (a link can be sent in a language), then the
         reader's last choice, then Arabic */
      try {
        var q = /[?&]lang=(ar|en)\b/.exec(location.search || ''), saved = localStorage.getItem('telmera.lang');
        if (q) lang = q[1]; else if (saved === 'ar' || saved === 'en') lang = saved;
      } catch (e) {}
      /* dash.js wires 3D meshes to their records in init(); there is no 3D here until the plant
         view is built (APP_PLAN.md stage C), and an empty list is the honest shape of that. */
      T.machines = T.machines || [];
      (T.data.lenses.lenses || []).forEach(function (l) { LENS[l.id] = l; });
      if (T.buildPackages) T.buildPackages();
      T.day.init(T.layout);
      T.day.playing = false;
      if (IA.opens_at_min != null) T.day.set(IA.opens_at_min);   /* desks.json _opens_at_doc */
      T.pages.init();
      render();

      document.addEventListener('click', function (e) {
        var c = function (sel) { return e.target.closest ? e.target.closest(sel) : null; };
        var x;
        if ((x = c('[data-model]'))) { T.pkg.set(x.getAttribute('data-model'), x.getAttribute('data-tier') || undefined); render(); return; }
        if ((x = c('[data-lang]')))  { lang = x.getAttribute('data-lang'); try { localStorage.setItem('telmera.lang', lang); } catch (err) {} render(); return; }
        if ((x = c('[data-go]')))    { var g = x.getAttribute('data-go'); go(g === 'plant' ? 'plant' : 'lens', g); return; }
        if ((x = c('[data-nav]')))   { var n = x.getAttribute('data-nav'); go(n === 'home' ? 'home' : n, n); return; }
        if ((x = c('[data-back]')))  { go('home'); return; }
        if ((x = c('[data-more]')))  { showAll = !showAll; render(); return; }
        if ((x = c('[data-machine]'))) { openMachine(x.getAttribute('data-machine')); return; }
        if ((x = c('[data-metric]'))) { openProv(x.getAttribute('data-metric')); return; }
        if (c('[data-close-prov]'))  { $('prov').setAttribute('data-open', '0'); return; }
        if (c('[data-close-sheet]')) { $('sheet').setAttribute('data-open', '0'); try { localStorage.setItem('telmera.install.dismissed', '1'); } catch (err) {} }
      });

      /* dragging the time repaints the plan in place - the slider itself is never re-created,
         or the thumb would be torn out from under the finger */
      document.addEventListener('input', function (e) {
        if (!e.target || !e.target.hasAttribute || !e.target.hasAttribute('data-time')) return;
        T.day.set(+e.target.value);
        $('tNow').textContent = T.dash.core.hhmm(T.day.t);
        $('planWrap').innerHTML = planHTML(); $('legend').innerHTML = legendHTML();
      });

      if (isIOS() && !standalone()) {
        var seen = null; try { seen = localStorage.getItem('telmera.install.dismissed'); } catch (e) {}
        if (seen !== '1') $('sheet').setAttribute('data-open', '1');
      }
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    },
    render: render, go: go, machine: openMachine, machineHTML: machineHTML,
    route: function () { return route; },
    lang: function (v) { if (v) { lang = v; render(); } return lang; }
  };
})(window.TELMERA);
</script>
<script>window.TELMERA.app.boot(window.TELMERA.appIA);</script>
</body>
</html>
