  font-family:var(--f-ui); font-size:var(--fs-body); line-height:var(--lh-base);
  background:var(--bg); color:var(--txt);
}
.sc-laptop{ /* 14in 1440px-wide laptop @ 600 mm · 4.645 px/mm · floor 11.6px -> 12px */
  --fs-micro:12px; --fs-label:13px; --fs-body:14px;
  --fs-headline:40px; --fs-big:48px; --fs-min:12px;
  --touch-min:28px; --touch-gap:6px;
  --kpi-max:7;
  font-family:var(--f-ui); font-size:var(--fs-body); line-height:var(--lh-base);
  background:var(--bg); color:var(--txt);
}
.sc-phone{ /* 390 CSS px phone @ 350 mm · 5.821 px/mm · floor 8.5px -> 10px */
  --fs-micro:10px; --fs-label:16px; --fs-body:18px;
  --fs-headline:48px; --fs-big:56px; --fs-min:10px;
  --touch-min:44px; --touch-gap:8px;
  --kpi-max:3;
  font-family:var(--f-ui); font-size:var(--fs-body); line-height:var(--lh-base);
  background:var(--bg); color:var(--txt);
}
.sc-tablet{ /* 10in 1280px-wide tablet @ 400 mm · 5.899 px/mm · floor 9.8px -> 10px */
  --fs-micro:10px; --fs-label:18px; --fs-body:21px;
  --fs-headline:56px; --fs-big:64px; --fs-min:10px;
  --touch-min:64px; --touch-gap:12px;
  --kpi-max:5;
  font-family:var(--f-ui); font-size:var(--fs-body); line-height:var(--lh-base);
  background:var(--bg); color:var(--txt);
}

/* ======================================================================================
   SPACE · RADIUS · MOTION (L7)
   ====================================================================================== */
:root{
  --sp-2:2px;
  --sp-4:4px;
  --sp-6:6px;
  --sp-8:8px;
  --sp-10:10px;
  --sp-12:12px;
  --sp-14:14px;
  --sp-16:16px;
  --sp-20:20px;
  --sp-24:24px;
  --sp-32:32px;
  --sp-40:40px;
  --sp-48:48px;
  --sp-64:64px;
  --r-sm:5px;
  --r-md:8px;
  --r-lg:11px;
  --r-xl:14px;
  --r-pill:999px;
  --d-instant:0ms;
  --d-fast:120ms;
  --d-base:180ms;
  --d-slow:300ms;
  --d-pulse:1300ms;
  --e-out:cubic-bezier(.2,.8,.2,1);
  --e-inout:cubic-bezier(.4,0,.2,1);
}

/* ======================================================================================
   THE CARRIERS — what makes L4 true in the markup, not just in the guide
   ====================================================================================== */
/* A state element declares its state and the glyph comes with it. A state written only as a
   colour fails check_tokens.mjs, and desaturating the screen is the test that proves it. */
[data-state]{--c:var(--st-nomeas)}
[data-state="run"]{--c:var(--st-run)}
[data-state="run"] > .glyph::before,[data-state="run"].glyph::before{content:"▶︎"}
[data-state="idle"]{--c:var(--st-idle)}
[data-state="idle"] > .glyph::before,[data-state="idle"].glyph::before{content:"❙❙"}
[data-state="setup"]{--c:var(--st-setup)}
[data-state="setup"] > .glyph::before,[data-state="setup"].glyph::before{content:"⚙︎"}
[data-state="fault"]{--c:var(--st-fault)}
[data-state="fault"] > .glyph::before,[data-state="fault"].glyph::before{content:"✖"}
[data-state="waitwork"]{--c:var(--st-waitwork)}
[data-state="waitwork"] > .glyph::before,[data-state="waitwork"].glyph::before{content:"◇"}
[data-state="waitop"]{--c:var(--st-waitop)}
[data-state="waitop"] > .glyph::before,[data-state="waitop"].glyph::before{content:"○"}
[data-state="noreport"]{--c:var(--st-noreport)}
[data-state="noreport"] > .glyph::before,[data-state="noreport"].glyph::before{content:"⌀"}
[data-state="off"]{--c:var(--st-off)}
[data-state="off"] > .glyph::before,[data-state="off"].glyph::before{content:"☾︎"}
[data-state="nomeas"]{--c:var(--st-nomeas)}
[data-state="nomeas"] > .glyph::before,[data-state="nomeas"].glyph::before{content:"–"}
[data-state="noreport"]{border-style:dashed!important}
[data-state="off"]{border-style:dotted!important}
[data-state="nomeas"] .num,[data-state="nomeas"] .sar{visibility:hidden}  /* silent: no number, no riyal */
[data-sev="hi"]{--c:var(--sev-hi)}
[data-sev="hi"] > .glyph::before,[data-sev="hi"].glyph::before{content:"✖"}
[data-sev="md"]{--c:var(--sev-md)}
[data-sev="md"] > .glyph::before,[data-sev="md"].glyph::before{content:"⚠︎"}
[data-sev="lo"]{--c:var(--sev-lo)}
[data-sev="lo"] > .glyph::before,[data-sev="lo"].glyph::before{content:"●"}
[data-sev="done"]{--c:var(--sev-done)}
[data-sev="done"] > .glyph::before,[data-sev="done"].glyph::before{content:"✓"}
[data-sev="hi"].pulse{animation:telPulse var(--d-pulse) infinite}
@keyframes telPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}}
@media(prefers-reduced-motion:reduce){
  [data-sev="hi"].pulse{animation:none;box-shadow:0 0 0 2px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
  *{transition-duration:0ms!important}
}
.num,.sar,table td,.kpi b,.pgBig{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:var(--focus-w) solid var(--accent);outline-offset:var(--focus-o)}
.basis{font-size:var(--fs-micro);border-radius:var(--r-sm);padding:0 var(--sp-4);border:1px solid var(--dim2);color:var(--dim2);font-style:normal}
.basis[data-basis="tbc"]{border-color:var(--basis-tbc);color:var(--basis-tbc)}
.basis[data-basis="measured"]{display:none}  /* measured is the default and wears no badge */

/* ======================================================================================
   THE RUNTIME'S OWN CLASSES — emitted by out/tokens.runtime.js
   ====================================================================================== */
.tel-chip,.tel-sev{display:inline-flex;align-items:baseline;gap:var(--sp-6);border-radius:var(--r-sm);
  border:1px solid var(--c);padding:0 var(--sp-6);font-size:var(--fs-label);line-height:1.6;color:var(--c)}
.tel-chip::before,.tel-sev::before{font-size:1em;line-height:1}
.tel-chip b,.tel-sev u{font-weight:var(--fw-semi);text-decoration:none}
.tel-sev b{color:var(--txt);font-weight:var(--fw-reg)}
.tel-chip em{font-style:normal;color:var(--dim)}
.num i{font-style:normal;font-size:.62em;color:var(--dim);margin-inline-start:.25em;font-weight:var(--fw-reg)}
.tbc-dash{color:var(--dim2)}   /* a number we do not have is a dash, never a zero */
/* TELMERA-TOKENS-END */
</style>
<style>/* app.css - the phone app's own layer. Everything it styles with comes from the design

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:var(--sp-10);padding:var(--sp-10) var(--sp-12);

            font-size:var(--fs-micro);font-weight:var(--fw-semi);color:var(--dim);letter-spacing:.08em}

/* ---------- the now strip ---------- */
.now{display:flex;align-items:baseline;gap:var(--sp-8);padding:var(--sp-12) var(--sp-12) var(--sp-8);
     color:var(--dim);font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase}

      border-radius:var(--r-lg);padding:var(--sp-12);min-height:var(--touch-min);
      transition:border-color var(--d-fast) var(--e-out),background var(--d-fast) var(--e-out)}

.tile .big{display:block;margin-top:var(--sp-10);font-size:var(--fs-headline);line-height:var(--lh-tight);
           font-weight:var(--fw-semi);letter-spacing:-.01em}
.tile .big span{display:block;font-size:var(--fs-micro);font-weight:var(--fw-reg);color:var(--dim);
                letter-spacing:0;margin-top:var(--sp-4);line-height:var(--lh-snug)}
.kids{display:flex;flex-wrap:wrap;gap:var(--sp-6);margin-top:var(--sp-10)}

     font-size:var(--fs-micro);color:var(--dim)}

     padding:0 var(--sp-6);color:var(--dim2)}

/* the plant tile is the one wide thing on the page, so the floor reads as a place, not a desk */

           padding:var(--sp-16) var(--sp-16) calc(var(--sp-16) + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

footer{padding:var(--sp-12);color:var(--dim2);font-size:var(--fs-micro);text-align:center}

.pg{padding:0 var(--sp-12) var(--sp-24)}

.hero .hv{display:block;font-size:var(--fs-headline);font-weight:var(--fw-semi);line-height:var(--lh-tight);margin-top:var(--sp-4);letter-spacing:-.01em}

     text-align:start;display:block;min-height:var(--touch-min)}

         border-radius:var(--r-md);color:var(--dim);font-size:var(--fs-micro)}
h3.sec{font-size:var(--fs-micro);color:var(--dim);letter-spacing:.1em;text-transform:uppercase;
       margin:var(--sp-20) 0 var(--sp-8);font-weight:var(--fw-semi)}
.adv{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-12);
     font-size:var(--fs-micro);line-height:var(--lh-base)}

ADVISOR - and you buy them in that order.","يقيس نظام تلميرا ما ينبض فعلاً في مصنعك، ويعرضه بعين الشخص الذي ينظر. ليس نظام تخطيط موارد ولا نظام إدارة: إنه يقيس، ثم يخبرك بما يعنيه القياس لعملك أنت. وهو مبني في ثلاثة طرازات - ماكينة، وحركة، ومستشار - وتُشترى بهذا الترتيب."]},{"id":"models","kw":["models","model a","model b","model c","machine motion advisor","difference between models","what do i get"],"kw_ar":["الطرازات","الموديلات","طراز","موديل","الفرق بين الطرازات","ماذا أحصل"],"t":["The three models","الطرازات الثلاثة"],"b":["A · MACHINE measures everything that runs on electricity: current clamp, energy meter, proximity, temperature and humidity. Its Pro tier adds the operator tablet, which is what turns an unexplained stop into a costed one. B · MOTION adds cameras and indoor location: safety, security, people and forklifts. C · ADVISOR adds prediction and me - I read all of it and tell each person what needs him. You can switch model at the top of the screen and watch the same plant lose and gain figures.","أ · ماكينة يقيس كل ما يعمل بالكهرباء: ملقط تيار، وعدّاد طاقة، وحساس اقتراب، وحرارة ورطوبة. ومستواه «برو» يضيف لوح المشغّل، وهو ما يحوّل التوقف غير المفسَّر إلى توقف مُسعَّر. ب · حركة يضيف الكاميرات وتحديد الموقع الداخلي: السلامة والأمن والأشخاص والرافعات. ج · مستشار يضيف التنبؤ ويضيفني أنا - أقرأ كل ذلك وأخبر كل شخص بما يحتاجه. ويمكنك تبديل الطراز من أعلى الشاشة ومشاهدة المصنع نفسه وهو يفقد الأرقام ويستعيدها."]},{"id":"sensors","kw":["sensor","sensors","clamp","ct","meter","proximity","temperature","camera","rtls","tablet","how do you measure"],"kw_ar":["حساس","حساسات","ملقط","ملقط التيار","عداد","اقتراب","حرارة","كاميرا","لوح","كيف تقيس"],"t":["The sensors, and what each one can and cannot see","الحساسات، وما يراه كل منها وما لا يراه"],"b":["Current clamp: is the machine off, powered, idle or running - and it times a repair exactly, because it sees the machine start again. Energy meter: real power, so kWh and riyals are measured and not estimated from current. Proximity: counts pieces. Temperature and humidity: the condition around the machine. Operator tablet: the job, the stop reason and the scrap - the only source of WHY. Cameras: what a person or a forklift did, never who. Indoor location: where a forklift is. A clamp sees no person and no forklift, because they draw no current - that is exactly why MOTION exists.","ملقط التيار: هل الماكينة مطفأة أم تحت الكهرباء أم خاملة أم تعمل - ويقيس زمن الإصلاح بدقة لأنه يرى الماكينة تعود للعمل. عدّاد الطاقة: قدرة حقيقية، فتكون الكيلوواط ساعة والريالات مقاسة لا مقدَّرة من التيار. حساس الاقتراب: يَعُدّ القطع. الحرارة والرطوبة: الظروف المحيطة بالماكينة. لوح المشغّل: أمر التشغيل وسبب التوقف والهدر - وهو المصدر الوحيد لـ«لماذا». الكاميرات: ماذا فعل شخص أو رافعة، لا من فعله. تحديد الموقع الداخلي: أين الرافعة. والملقط لا يرى شخصاً ولا رافعة لأنهما لا يسحبان تياراً - ولهذا بالضبط وُجد طراز الحركة."]},{"id":"numbers","kw":["where do the numbers come from","trace","provenance","is this real","simulated","how is it calculated","formula","source"],"kw_ar":["من أين تأتي الأرقام","من وين الارقام","المصدر","هل هذا حقيقي","محاكاة","كيف يُحسب","المعادلة"],"t":["Where every number comes from","من أين يأتي كل رقم"],"b":["Click any figure on the dashboard and it opens its own trace: the formula in words, the sensors it needs with a tick beside the ones this model actually has, whether it is measured, example, scenario or still to be confirmed, and the machines behind it. This demo runs on a simulated day, so doubt is the correct reaction - the trace is the answer to it. I work the same way: I never say a number I cannot point at.","اضغط أي رقم في لوحة المؤشرات فيفتح مصدره: المعادلة بالكلمات، والحساسات التي يحتاجها مع علامة بجانب ما يملكه هذا الطراز فعلاً، وهل هو مقاس أم مثال أم سيناريو أم ما زال يحتاج تأكيداً، والماكينات التي وراءه. وهذا العرض يعمل على يوم محاكى، فالشك هو ردّ الفعل الصحيح - والمصدر هو الجواب عليه. وأنا أعمل بالطريقة نفسها: لا أقول رقماً لا أستطيع أن أشير إليه."]},{"id":"howto","kw":["how do i use","how to use","help","explain the system","teach me","guide","what can you do","getting started"],"kw_ar":["كيف أستخدم","كيف استخدم","شرح النظام","علّمني","ساعدني","ماذا تستطيع","من أين أبدأ","دليل"],"t":["How to use this screen","كيف تستخدم هذه الشاشة"],"b":["Four controls run everything. THE LENS picks whose eyes you are looking through - owner, operations, production, maintenance and nine more; the plant and the figures both change with it. THE MODEL picks what is installed; switch it to see what a figure costs you when the sensor is not there. THE VIEW switches between the plant in 3D and the dashboard. THE CLOCK at the bottom replays the whole day - drag it and everything follows. Click a machine to open its card, and click any figure to see where it came from.","أربعة عناصر تُدير كل شيء. العدسة تختار بعين من تنظر - المالك، العمليات، الإنتاج، الصيانة، وتسع عدسات أخرى؛ ويتغير معها المصنع والأرقام. والطراز يختار ما هو مركَّب؛ بدّله لترى ماذا يكلّفك غياب حسّاس. والعرض يبدّل بين المصنع ثلاثي الأبعاد ولوحة المؤشرات. والساعة في الأسفل تعيد تشغيل اليوم كاملاً - اسحبها فيتبعها كل شيء. واضغط ماكينة لفتح بطاقتها، واضغط أي رقم لترى من أين جاء."]},{"id":"alerts","kw":["alert","alerts","notification","who gets told","escalation","inbox","policy"],"kw_ar":["تنبيه","التنبيهات","إشعار","من يُبلَّغ","تصعيد","البريد","السياسة"],"t":["How an alert is decided","كيف يُقرَّر التنبيه"],"b":["One owner, a named few informed, one escalation if it is not closed. Nothing is instant except safety, because a screen that shouts at everyone teaches everyone to ignore it. An event with no owner is written to the log and pushed to nobody. A stop with no recorded reason is never given a riyal figure - we show the hours and say plainly that nobody wrote down why.","مسؤول واحد، وعدد محدود يُبلَّغون للعلم، وتصعيد واحد إن لم تُغلَق. ولا شيء فوري إلا السلامة، لأن شاشة تصرخ في وجه الجميع تُعلِّم الجميع تجاهلها. والحدث بلا مسؤول يُكتب في السجل ولا يُرسَل لأحد. والتوقف بلا سبب مسجَّل لا يُعطى أي قيمة بالريال - نعرض الساعات ونقول بوضوح إن أحداً لم يكتب السبب."]},{"id":"people","kw":["privacy","person","name","monitor people","spy","surveillance","worker"],"kw_ar":["الخصوصية","شخص","اسم","مراقبة الأشخاص","تجسس","عامل","الموظفين"],"t":["The system does not score people","النظام لا يقيّم الأشخاص"],"b":["No figure in this system is attached to a named person. The data is held by machine, by section and by job - never by employee. Cameras record what happened, not who did it. Scrap is counted against the job, not against the operator who pressed the button. This is a design rule, not a setting, and it is the reason the floor will use it instead of working around it.","لا يرتبط أي رقم في هذا النظام بشخص بعينه. البيانات محفوظة حسب الماكينة والقسم وأمر التشغيل - لا حسب الموظف. والكاميرات تسجّل ما حدث، لا من فعله. والهدر يُحتسب على أمر التشغيل، لا على المشغّل الذي ضغط الزر. هذه قاعدة تصميم لا إعداد يُغيَّر، وهي سبب استخدام أرضية المصنع له بدل الالتفاف عليه."]},{"id":"languages","kw":["language","arabic","english","hindi","translate","speak"],"kw_ar":["اللغة","عربي","انجليزي","هندي","ترجمة","لغات"],"t":["Languages","اللغات"],"b":["The system runs in Arabic and English today, and is built so a worker reads it in his own language - Hindi, Bengali, Filipino and French are next. Every string lives outside the code, so adding a language is translation work and not development work. I speak aloud in whichever language the screen is in, using the voices installed on this device; you can pick the voice yourself.","يعمل النظام اليوم بالعربية والإنجليزية، وهو مبني ليقرأه كل عامل بلغته - والهندية والبنغالية والفلبينية والفرنسية تالياً. وكل نص يعيش خارج الشيفرة، فإضافة لغة عمل ترجمة لا عمل برمجة. وأنا أنطق باللغة المعروضة على الشاشة بالأصوات المثبَّتة على هذا الجهاز، ويمكنك اختيار الصوت بنفسك."]},{"id":"advisorai","kw":["how do you work","are you ai","llm","chatgpt","do you guess","can you be wrong"],"kw_ar":["كيف تعمل","هل أنت ذكاء اصطناعي","هل تخمن","هل تخطئ","نموذج لغوي"],"t":["How I work","كيف أعمل"],"b":["I sit on four layers: the sensors, a computation layer that turns them into facts with a formula attached, a rules layer that decides what needs whom, and language on top. The rule that governs all of it is that the language layer never produces a number. I read figures that were computed; I choose which ones answer you, and I say where each came from. If a question needs a number the plant cannot measure, I say so instead of estimating.","أقوم على أربع طبقات: الحساسات، وطبقة حساب تحوّلها إلى حقائق مرفقة بمعادلتها، وطبقة قواعد تقرّر ما يحتاج إلى من، واللغة فوقها. والقاعدة التي تحكم ذلك كله أن طبقة اللغة لا تُنتج رقماً أبداً. أنا أقرأ أرقاماً حُسبت، وأختار منها ما يجيبك، وأقول من أين جاء كل رقم. وإن احتاج سؤالك رقماً لا يستطيع المصنع قياسه، قلت ذلك بدل أن أقدّره."]}]},"lean":{"fiveS":{"example":true,"max":5,"cadence":"weekly, by the section supervisor","cadence_ar":"أسبوعي، من مشرف القسم","steps":[{"id":"sort","jp":"Seiri","en":"Sort","ar":"فرز"},{"id":"set","jp":"Seiton","en":"Set in order","ar":"ترتيب"},{"id":"shine","jp":"Seiso","en":"Shine","ar":"تنظيف"},{"id":"standard","jp":"Seiketsu","en":"Standardise","ar":"توحيد"},{"id":"sustain","jp":"Shitsuke","en":"Sustain","ar":"استدامة"}],"zones":{"RAW":[3,2,2,2,2],"FAB":[4,3,3,3,2],"PNT":[4,4,3,3,3],"BUS":[4,3,3,3,2],"UTL":[3,3,3,2,2],"FG":[2,2,3,2,2],"QC":[5,4,4,4,3],"OFF":[4,4,4,4,3],"ASM":[3,3,2,3,2],"MNT":[2,2,2,2,1],"WIR":[4,4,4,3,3],"SMK":[4,4,3,4,3],"ELP":[4,3,3,3,2],"CMP":[3,3,3,2,2]}},"marks":[{"kind":"bay","x":37.6,"y":21.4,"w":1.8,"h":1.2,"zone":"ASM","label":"Trolley","label_ar":"عربة"},{"kind":"bay","x":37.6,"y":23.2,"w":1.8,"h":1.2,"zone":"ASM","label":"Kit cart","label_ar":"عربة طقم"},{"kind":"bay","x":2,"y":22.9,"w":2,"h":1.2,"zone":"FG","label":"Pallet","label_ar":"طبلية"},{"kind":"bay","x":5,"y":22.9,"w":2,"h":1.2,"zone":"FG","label":"Pallet","label_ar":"طبلية"},{"kind":"bay","x":43,"y":31,"w":1.6,"h":0.9,"zone":"SMK","label":"Kanban","label_ar":"كانبان"} ended minutes minus running minutes, from the current clamp's state ladder (off · powered · idle · running).","مجموع الدقائق المأهولة ناقص دقائق التشغيل لكل ماكينة مقاسة، من سلّم الحالات في ملقط التيار (مطفأة · تحت الكهرباء · خاملة · تعمل)."]},"util":{"label":["Utilisation","نسبة الاستغلال"],"unit":"%","needs":["ct"],"status":"measured","hist":"util","better":"up","formula":["running minutes ÷ attended minutes, scored machines only. Utilisation, not efficiency: four hours run of eight is 50% utilisation.","دقائق التشغيل ÷ الدقائق المأهولة، للماكينات المقاسة فقط. هذا استغلال وليس كفاءة: أربع ساعات تشغيل من ثمانٍ تعني 50% استغلالاً."]},"running_now":{"label":["Running now","تعمل الآن"],"unit":"n","needs":["ct"],"status":"measured","better":"up","formula":["machines whose current clamp reads the running band at this minute.","الماكينات التي يقرأ ملقط تيارها نطاق التشغيل في هذه الدقيقة."]},"stopped_now":{"label":["Not running now","متوقفة الآن"],"unit":"n","needs":["ct"],"status":"measured","better":"down","formula":["machines powered but not running at this minute. The reason is the one pressed on the operator tablet; without the tablet (MACHINE Basic) it is not known.","ماكينات تحت الكهرباء ولا تعمل في هذه الدقيقة. السبب هو ما ضُغط على لوح المشغّل؛ ودون اللوح (ماكينة الأساسي) لا يُعرف."]},"downtime_sar":{"label":["Lost output, SAR","إنتاج ضائع بالريال"],"unit":"SAR","money":true,"needs":["ct","tablet"],"status":"measured","hist":"sar","better":"down","formula":["minutes stopped WITH a recorded reason × the machine's hourly rate ÷ 60. Unexplained idle is shown in hours and never costed: time nobody explained may simply be no demand.","دقائق التوقف التي سُجّل سببها × السعر الساعي للماكينة ÷ 60. الخمول غير المفسَّر يُعرض بالساعات ولا يُسعَّر: وقت لم يفسّره أحد قد يكون ببساطة غياب طلب."]},"top_cause":{"label":["Biggest loss","أكبر خسارة"],"unit":"text","needs":["ct","tablet"],"status":"measured","formula":["the stop reason with the most minutes today, as pressed on the operator tablet.","سبب التوقف صاحب أكبر عدد دقائق اليوم، كما ضُغط على لوح المشغّل."]},"unlogged_h":{"label":["Stops nobody explained","توقفات بلا تفسير"],"unit":"h","needs":["ct"],"status":"measured","better":"down","formula":["powered-not-running time with no reason attached. In MACHINE Basic that is every stop, because nobody is asked.","وقت تحت الكهرباء دون تشغيل وبلا سبب مرفق. في ماكينة الأساسي هذا هو كل توقف، لأن أحداً لا يُسأل."]},"pieces":{"label":["Pieces made","قطع منتجة"],"unit":"n","needs":["prox"],"status":"measured","better":"up","formula":["strokes counted by the proximity switch on each producing machine, so far today.","الضربات التي عدّها حساس الاقتراب على كل ماكينة منتجة حتى الآن اليوم."]},"cycle_s":{"label":["Real cycle time","زمن الدورة الحقيقي"],"unit":"s","needs":["ct","prox"],"status":"measured","better":"down","formula":["running seconds ÷ pieces, per machine, averaged. The TRUE cycle, including the micro-stops a stopwatch study never sees.","ثواني التشغيل ÷ القطع لكل ماكينة، ثم المتوسط. الدورة الحقيقية بما فيها التوقفات الصغيرة التي لا تراها دراسة الوقت."]},"oee":{"label":["OEE","الفعالية الكلية OEE"],"unit":"%","needs":["ct","prox","tablet"],"status":"tbc","better":"up","formula":["Availability × Performance × Quality. A from the clamp, Q from the scrap count on the tablet - and P needs the IDEAL cycle time per product, which the plant must supply. Until it does, OEE is printed TBC rather than guessed.","التوافر × الأداء × الجودة. التوافر من الملقط، والجودة من عدّ الهالك على اللوح — والأداء يحتاج زمن الدورة المثالي لكل منتج، وعلى المصنع تزويده. إلى أن يفعل، تُطبع OEE كـ TBC ولا تُخمَّن."]},"fpy":{"label":["First-pass yield","الإنتاج السليم من المرة الأولى"],"unit":"%","needs":["tablet"],"status":"scenario","better":"up","formula":["pieces passing the test station first time ÷ pieces tested. The station is the reference, not the operator.","القطع الناجحة في محطة الفحص من المرة الأولى ÷ القطع المفحوصة. المحطة هي المرجع لا المشغّل."]},"kwh":{"lab /* packages.js - THE THREE MODELS, and the one place that knows which one is switched on.
 *
 * Jamal, 25 Nov 2026: "I want a tab for model A B C with the names I gave them, and when I put
 * the model it shows me the things that will be in that model - model A will not have people and
 * forklifts - and how does that reflect through the eyes of the owner, the operations manager,
 * the production manager, the maintenance manager, each with his team."
 *
 * ONE CORRECTION TO THAT, AND IT IS THE THING THAT SELLS: the people and the forklifts do NOT
 * come out of the plant in model A. A factory has people and forklifts whatever the customer
 * bought. What comes out is the MEASUREMENT: they are drawn, greyed, and carry no figure, and
 * hovering them says which model measures them. What genuinely disappears is TELMERA's own
 * hardware - the cameras, the PoE switch, the recorder - because the customer has not bought it,
 * and drawing it would be a lie. An unmeasured asset is not a hole in the pitch; it IS the next
 * model's pitch, and the figure it unlocks is written beside it.
 *
 * EVERYTHING HERE IS DATA: telmera/data/packages.json. Moving a lens between models is an edit
 * to that file. There is no fourth model and Pro is a tier inside model 1, never a model.
 */
window.TELMERA = window.TELMERA || {};
(function (T) {
  'use strict';

  T.buildPackages = function () {
    var P = T.data.packages;
    var cur = P.start || P.models[0].id;
    var tier = P.start_tier || 'basic';

    function model(id) {
      var m = P.models.filter(function (x) { return x.id === (id || cur); })[0];
      return m || P.models[0];
    }
    /* the column of the matrix this model and tier read: a Pro machine is its own column */
    function column() {
      if (cur === 'machine' && tier === 'pro') return 'machine_pro';
      return cur;
    }

    /* WHAT THE SWITCHED-ON MODEL CAN SENSE - a map, recomputed on every switch, because kindOf()
       in dash.js asks it once per timeline segment and has to stay cheap. */
    var SENSE = {};
    function resense() {
      SENSE = {};
      (model().senses || []).forEach(function (k) { SENSE[k] = true; });
      if (cur === 'machine') {
        var tt = (model().tiers || []).filter(function (x) { return x.id === tier; })[0];
        (tt && tt.adds || []).forEach(function (k) { SENSE[k] = true; });
      }
    }

    var api = {
      all: P.models,
      /* can the running model sense this? 'tablet' is the one that decides whether a stop has a
         REASON, 'camera' whether anything about people, safety or the floor exists at all */
      senses: function (k) { return !!SENSE[k]; },
      /* which model is on */
      id: function () { return cur; },
      tier: function () { return tier; },
      model: model,
      column: column,
      /* a model id + optional tier, e.g. set('machine', 'pro') */
      set: function (id, t) {
        if (!P.models.some(function (m) { return m.id === id; })) return false;
        cur = id;
        tier = (id === 'machine') ? (t || tier || 'basic') : 'basic';
        resense();
        return true;
      },
      /* is this piece of the plant installed in the current model? */
      has: function (what) { return (model().scene || []).indexOf(what) >= 0; },
      /* is this actor drawn but unmeasured in the current model? */
      unmeasured: function (what) { return (model().unmeasured || []).indexOf(what) >= 0; },

      /* ---- the lens matrix ----
         Returns { state, why, unlock, unlockIn } for a lens in the current model.
           state    full | partial | locked
           why      what it DOES give here (partial only)
           unlock   the figure that opens up
           unlockIn the model (or tier) that opens it: 'pro' | 'motion' | 'advisor' */
      lens: function (lensId) {
        var row = P.lenses[lensId];
        if (!row) return { state: 'full' };
        var st = row[column()] || 'full';
        var out = { state: st };
        if (st === 'full') return out;
        if (st === 'partial' && row.partial) out.why = row.partial;
        /* what opens it, cheapest step first: Pro, then MOTION, then ADVISOR */
        if (row.unlock_pro && column() === 'machine') { out.unlock = row.unlock_pro; out.unlockIn = 'pro'; }
        else if (row.unlock_motion && (column() === 'machine' || column() === 'machine_pro')) { out.unlock = row.unlock_motion; out.unlockIn = 'motion'; }
        else if (row.unlock_pro) { out.unlock = row.unlock_pro; out.unlockIn = 'pro'; }
        return out;

  /* ================================================================================
     THE TIME AXIS
     16 Nov 2026 (Jamal): "the dashboard has to show something live, and results as well -
     this month, this quarter, this year - and where it improved and where it dropped."
     So the lens answers WHO is looking and the range answers OVER WHAT PERIOD. They are
     independent: ten lenses x six ranges, one set of numbers.

     What is honest here: the simulator has produced THIRTY days. A week and a month are
     therefore measured; a quarter and a year are NOT, and they say so and show the run rate
     as a projection, labelled as one. We do not draw a year we have not got.
     ================================================================================ */
  var RANGES = [
    { id: 'now',     key: 'range.now',     days: 0,   live: true },

    { id: 'month',   key: 'range.month',    days: 30 },

    if (id !== undefined) range = RANGES.filter(function (r) { return r.id === id; })[0] ? id : 'day';
    return range;
  };
  function rangeDef() { return RANGES.filter(function (r) { return r.id === range; })[0] || RANGES[1]; }

  /* which keys of H.days add up over a period and which average across it */

  function measuredDays() { return H ? H.days.filter(function (d) { return !d.off; }) : []; }
  /* the window of the last n measured days, `back` periods ago (0 = the current one) */
  function windowOf(n, back) {

    var end = v.length - (back || 0) * n;

    var got = end - start;

  }

  }

  /* ================================================================================
     THE ADVISOR
     16 Nov 2026 (Jamal): "what do I do - under a heading of advice. I think that belongs

     A dashboard that stops at "what happened" leaves the reader to work out what to do.
     The industry word for the step past that is PRESCRIPTIVE: not "bearing wear detected on

     Every piece of advice here carries the same five things, and the renderer enforces it:
       DO    - one action, in the imperative

      A.push(o);
    }

      push({ score: sarIfLogged * WORKDAYS, kind: 'blind', own: OWN.prod, lens: ['owner', 'ops', 'prod', 'lean'],
        do_: 'ui.make-the-reason-screen-mandatory-before-a-re',
        why: P('adv.blind.why', { d: [dur(unlogged, false), dur(unlogged, true)], p: pct(unlogged / p.att) }),
        worth: sarIfLogged ? P('adv.blind.worth', { v: num(sarIfLogged * WORKDAYS) }) : P('adv.blind.worth-none'),
        money: true });

      if (keys.length) {

          why: P('adv.pareto.why', { h: num(hrs) }),

      if (worst) {
        var hm = H.machines[worst], hs = B.health(worst), ah = AH && AH.assets[worst], late = ah ? ah.days_since_pm - ah.pm_interval_days : null;
        push({ score: 40000 + (100 - hs) * 900, kind: 'asset', own: OWN.maint, lens: ['ops', 'maint', 'owner'], m: worst,
          do_: P(late !== null && late > 0 ? 'adv.asset.do-late' : 'adv.asset.do-check',
                 { m: [nameOf(worst, false), nameOf(worst, true)] }),
          why: (function () {
            var base = P('adv.asset.why', { hs: hs, bd: hm.bd, mttr: hm.mttr });
            if (!(late !== null && late > 0)) return base;
            var tail = P('adv.asset.why-late', { d: late });
            return [base[0] + tail[0], base[1] + tail[1]];
          })(),
          worth: 'ui.maintenance-is-never-shown-a-riyal-this-is-r',
          money: false, exampleIf: (late !== null && late > 0) });
      }
    }
    /* 4 - electricity burned by machines that were not making anything */
    if (e.standbySar > 0 && e.sar > 0 && e.standbySar / e.sar > 0.06) {
      var burn = LY.energy.by_machine.slice().sort(function (a, b) { return b.standby_kwh - a.standby_kwh; })[0];
      push({ score: e.standbySar * WORKDAYS, kind: 'energy', own: OWN.eng, lens: ['owner', 'ops', 'energy', 'lean'], m: burn && burn.id,
        do_: P('adv.energy.do', { m: burn ? [nameOf(burn.id, false), nameOf(burn.id, true)] : P('ui.the-biggest-burner') }),
        why: P('adv.energy.why', { v: num(e.standbySar), p: pct(e.standbySar / e.sar) }),
        /* THE MONEY RULE REACHES INTO THE REASON, not only the worth. A lens with no financial
           permission was being shown "SAR 25 of today's electricity..." in the why line and then
           told underneath that the cost is hidden from it. Caught 25 Nov 2026 by the phone app's
           harness. Same fact, counted in kWh. */
        why_nomoney: P('adv.energy.why-nomoney', { k: num(e.standbyKwh), p: pct(e.standbySar / e.sar) }),
        worth: P('adv.month', { v: num(e.standbySar * WORKDAYS) }),
        money: true });
    }
    /* 5 - the machine furthest below its own target */
    if (H && H.target) {
      var gap = null;
      p.rows.forEach(function (r) {
        var tg = H.target[r.id]; if (!tg || r.u.att < 60) return;
        var d = tg - r.u.util; if (!gap || d > gap.d) gap = { id: r.id, d: d, u: r.u, tg: tg };
      });
      if (gap && gap.d > 0.07) {
        var rec0 = REC[gap.id], lost = gap.d * (rec0.att_min || 480) / 60 * rec0.cost;
        push({ score: lost * WORKDAYS, kind: 'gap', own: OWN.prod, lens: ['ops', 'prod', 'owner'], m: gap.id,
          do_: P('adv.gap.do', { m: [nameOf(gap.id, false), nameOf(gap.id, true)] }),
          why: P('adv.gap.why', { u: pct(gap.u.util), t: pct(gap.tg), n: Math.round(gap.d * 100) }),
          worth: P('adv.gap.worth', { v: num(lost * WORKDAYS) }),
          money: true });
      }
    }
    /* 6 - material at the station instead of the station walking to the material */
    var wait = p.by['Waiting for material'] || 0;
    if (wait > 25) {
      var rate2 = p.stopS ? p.sar / (p.stopS / 60) : 0;
      push({ score: wait / 60 * rate2 * WORKDAYS, kind: 'material', own: OWN.ware, lens: ['ops', 'warehouse', 'owner', 'prod', 'lean'],
        do_: 'ui.kit-the-next-job-to-the-station-before-the-c',
        why: P('adv.material.why', { d: [dur(wait, false), dur(wait, true)] }),
        worth: rate2 ? P('adv.month', { v: num(wait / 60 * rate2 * WORKDAYS) }) : ['-', '-'],
        money: true });
    }
    /* 6b - CHANGEOVER. 17 Nov 2026, with the lean lens: this is the loss every plant pays and
       nobody meters, and it is the one lean improvement with a measured before and after. The
       rule fires on the machine carrying the most setup time, because that is where a SMED
       exercise pays first - and it is costed, because changeover IS stopped machine time. */
    var coMin = p.by['Changeover / setup'] || 0;
    if (coMin > 30) {
      var coWorst = null;
      p.rows.forEach(function (r) { var m2 = r.u.by['Changeover / setup'] || 0; if (m2 && (!coWorst || m2 > coWorst.m)) coWorst = { id: r.id, m: m2 }; });
      var coRate = p.stopS ? p.sar / (p.stopS / 60) : 0, coSave = coMin / 60 * coRate * 0.4;
      push({ score: coSave * WORKDAYS, kind: 'changeover', own: OWN.prod, lens: ['lean', 'prod', 'ops', 'owner'], m: coWorst && coWorst.id,
        do_: P('adv.co.do', { m: coWorst ? [nameOf(coWorst.id, false), nameOf(coWorst.id, true)] : P('ui.the-worst-station') }),
        why: (function () {
          var base = P('adv.co.why', { d: [dur(coMin, false), dur(coMin, true)] });
          if (!coWorst) return base;
          var tail = P('adv.co.why-one', { d: [dur(coWorst.m, false), dur(coWorst.m, true)] });
          return [base[0] + tail[0], base[1] + tail[1]];
        })(),
        worth: coSave ? P('adv.co.worth', { v: num(coSave * WORKDAYS) }) : P('ui.not-costed'),
        money: true });
    }
    /* 6c - the weakest 5S section. Never costed: an audit score is not a riyal, and pretending
       it is would be the first dishonest number on these screens. */
    var F5 = fiveS();
    if (F5 && F5.rows.length) {
      var w5 = F5.rows[0], wsum = null;
      (F5.F.steps || []).forEach(function (st, i) { if (wsum === null || w5.v[i] < w5.v[wsum]) wsum = i; });
      if (w5.tot / w5.mx < 0.72) {
        push({ score: 1.2e8, kind: 'fives', own: OWN.prod, lens: ['lean', 'prod', 'supervisor', 'ops'],
          do_: P('adv.5s.do', { z: [zname(w5.zone, false), zname(w5.zone, true)],
                                s: F5.F.steps[wsum] ? [F5.F.steps[wsum].en, F5.F.steps[wsum].ar] : P('ui.the-weakest-s') }),
          why: P('adv.5s.why', { t: w5.tot, m: w5.mx }),
          worth: 'ui.not-costed-a-5s-score-is-a-score-never-a-riy',
          money: false, tbc: true });
      }
    }
    /* 7 - a standing violation. Safety is never ranked by money.
       17 Nov 2026: the lens list used to be the four hard-coded here, so a quality violation
       never reached the quality advisor and a lean one reached nobody. It is the violation's
       OWN `owners` now - the same field the model and the page already obey - and the owning
       department is taken from the first code letters, so a new violation needs no code here.
       A lo-grade one scores below a md one: housekeeping is real and it is not an alarm. */
    var VOWN = { PPE: OWN.safe, EXT: OWN.safe, YRD: OWN.safe, ELC: OWN.eng, ENR: OWN.eng,
                 QAL: OWN.qual, CAL: OWN.qual, LEN: OWN.prod, SEC: OWN.sec, MAT: OWN.ware };
    (VIOL || []).forEach(function (v) {
      if (!(t >= v.open && (v.close === undefined || t < v.close))) return;
      push({ score: v.sev === 'hi' ? 9e8 : v.sev === 'lo' ? 1.5e8 : 4e8, kind: 'violation',
        own: VOWN[(v.code || '').slice(0, 3)] || OWN.safe,
        lens: (v.owners && v.owners.length) ? v.owners : ['owner', 'ops', 'safety', 'security'],
        cam: v.cam, sev: v.sev,
        do_: [v.fix, v.fix_ar || v.fix],
        why: P('adv.viol.why', { w: [v.what, v.what_ar || v.what], c: v.code, r: [v.rule, v.rule_ar || v.rule] }),
        worth: 'ui.not-traded-against-output-a-standing-violati',
        money: false });
    });
    /* 8 - first pass yield */
    if (q.tested > 5 && q.fpy < 0.95) {
      var top = null, cnt = {};
      q.fails.forEach(function (f) { cnt[f.reason] = (cnt[f.reason] || 0) + 1; if (!top || cnt[f.reason] > cnt[top]) top = f.reason; });
      push({ score: 2e8, kind: 'quality', own: OWN.qual, lens: ['owner', 'ops', 'quality'], m: LY.quality.station,
        do_: P('adv.quality.do', { r: top ? [top, FAIL_KEY[top] ? S(FAIL_KEY[top], true) : top] : P('ui.the-top-fail-reason') }),
        why: P('adv.quality.why', { f: (q.fpy * 100).toFixed(1), n: q.fails.length, t: q.tested }),
        worth: 'ui.rework-hours-are-not-in-the-simulator-yet-tb',
        money: false, tbc: true });
    }
    /* 9 - what no camera sees */
    var cs = T.cameras && T.cameras.stats;
    if (cs && cs.blind) {
      push({ score: 1.2e8, kind: 'blind_cam', own: OWN.sec, lens: ['security', 'safety', 'ops'],
        do_: 'ui.close-the-blind-spots-before-the-hardware-or',
        why: P('adv.blindcam.why', { a: cs.blind * 4, p: pct(cs.perimeter), h: pct(cs.hall) }),
        worth: 'ui.a-planning-figure-on-a-2-m-grid-machines-and',
        money: false });
    }
    /* 10 - assets with no sensor at all: they are outside every figure above */
    var naCount = plant(t).counts.na || 0;
    if (naCount) {
      push({ score: 0.9e8, kind: 'unmeasured', own: OWN.it, lens: ['owner', 'ops', 'prod', 'maint'],
        do_: P('adv.unmeasured.do', { n: naCount }),
        why: P('adv.unmeasured.why', { n: naCount }),
        worth: 'ui.unknown-by-definition-that-is-the-point',
        money: false });
    }
    /* 11 - peak demand, which the tariff charges for separately in KSA */
    if (e.peak && e.now && e.peak > e.now * 1.35) {
      push({ score: 0.8e8, kind: 'peak', own: OWN.eng, lens: ['energy', 'owner', 'ops'],
        do_: 'ui.stagger-the-two-biggest-starts-so-they-never',
        why: P('adv.peak.why', { p: num(e.peak), n: num(e.now) }),
        worth: 'ui.the-demand-charge-is-not-in-the-tariff-we-mo',
        money: false, tbc: true });
    }

    /* 12 - a device went quiet. This outranks almost everything: a figure nobody can trust is
       worse than a bad figure, because a bad figure at least gets argued with. */
    silentAt(t).forEach(function (d, i) {
      var hrs = (t - d.since) / 60;
      push({ score: 9.5e8 - i, kind: 'silent', own: OWN.it, lens: ['syshealth', 'ops', 'owner', 'maint', 'security'],
        m: /^M\d/.test(d.id) ? d.id : null, cam: /^C\d/.test(d.id) ? d.id : null,
        do_: P('adv.silent.do', { d: d.id }),
        why: (function () {
          var base = P('adv.silent.why', { w: [d.what, d.what_ar || d.what], t: hhmm(d.since), h: n1(hrs),
                                           e: [d.effect, d.effect_ar || d.effect] });
          if (!d.affects) return base;
          /* the separator is punctuation and it is language-dependent: Arabic uses U+060C. */
          var tail = P('adv.silent.took', { l: [d.affects.join(S('ui.list-separator', false)),
                                                d.affects.join(S('ui.list-separator', true))] });
          return [base[0] + tail[0], base[1] + tail[1]];
        })(),
        worth: 'ui.not-costed-the-cost-of-a-blind-spot-is-the-d',
        money: false, tbc: true });
    });

    A.sort(function (a, b) { return b.score - a.score; });
    return A;
  }

  function adviceHTML(t, ar, lensId, money, max) {
    var A = advisories(t, ar).filter(function (a) { return !a.lens || a.lens.indexOf(lensId) >= 0; });
    if (!A.length) return empty(S('ui.nothing-worth-advising-right-now-which-is-it', ar));
    return A.slice(0, max || 4).map(function (a, i) {
      var attr = a.m ? ' data-m="' + a.m + '"' : a.cam ? ' data-cam="' + a.cam + '"' : '';
      var sev = a.kind === 'violation' ? (a.sev === 'hi' ? ' hi' : ' md') : '';
      var worth = (a.money && !money) ? (S('ui.cost-is-hidden-in-this-lens', ar)) : L2(a.worth, ar);
      var why = (a.money && !money && a.why_nomoney) ? L2(a.why_nomoney, ar) : L2(a.why, ar);
      return '<div class="adv' + sev + '"' + attr + '>' +
        '<div class="advTop"><i>' + (i + 1) + '</i><b>' + L2(a.do_, ar) + '</b></div>' +
        '<div class="advRow"><span>' + (S('ui.why', ar)) + '</span><p>' + why + '</p></div>' +
        '<div class="advRow"><span>' + (S('ui.worth', ar)) + '</span><p>' + worth + (a.tbc ? exTag(ar) : '') + '</p></div>' +
        '<div class="advRow"><span>' + (S('ui.owner', ar)) + '</span><p>' + L2(a.own, ar) +
          (attr ? '<em>' + (S('ui.open-the-proof', ar)) + '</em>' : '') + '</p></div>' +
        '</div>';
    }).join('');
  }

  /* ---------------- standing violations ---------------- */
  var VIOL = [];
  /* A VIOLATION BELONGS TO THE LENSES NAMED IN ITS OWN `owners`, ON THE PAGE TOO.
     17 Nov 2026: with three violations the dashboard could list all of them under safety and
     get away with it. With twelve it cannot - the safety page would carry a calibration
     certificate and an air leak, and the quality page would carry none of its own. The model
     has enforced ownership since round 5 (yard.js setLens); the page now does the same, from
     the same field, so the two can never disagree. No lens id is hard-coded in either place.
     Called with no lens it still returns everything, which is what the live board and the
     recorder want. */
  function ownsLens(v, lensId) { return !lensId || !v.owners || v.owners.indexOf(lensId) >= 0; }
  /* a violation is SEEN BY A CAMERA. With no cameras installed there is no violation to show -
     not a hidden one, not a greyed one: none, because nothing in the plant could have seen it. */
  function violsAt(t, lensId) { if (!camsOn()) return []; return VIOL.filter(function (v) { return t >= v.open && (v.close === undefined || t < v.close) && ownsLens(v, lensId); }); }
  /* ONES THAT WERE CLOSED TODAY.
     16 Nov 2026. V2 is cleared at 18:30 and nothing anywhere counted it. A system that only
     ever shows what is wrong teaches the floor that the screen is a complaints board. The
     thing that actually sells this product is the loop CLOSING: found at 09:30, cleared at
     18:30, nine hours standing, and here is the camera that watched both ends of it. */
  function violsClosed(t, lensId) { if (!camsOn()) return []; return VIOL.filter(function (v) { return v.close !== undefined && t >= v.close && ownsLens(v, lensId); }); }
  var SEV_SAY = { hi: 'ui.stop-now', md: 'ui.fix-today', lo: 'ui.housekeeping' };
  function violHTML(t, ar, lensId, zoneFilter) {
    var open = violsAt(t, lensId);
    if (zoneFilter) open = open.filter(zoneFilter);
    if (!open.length) return empty(S('ui.no-violation-standing-under-this-lens-right-', ar));
    return open.map(function (v) {
      var say = SEV_SAY[v.sev] || SEV_SAY.md;
      /* a MOVING violation has no place - it has a person. It says where he is instead. */
      var where = v.where ? (LF(v, 'where', ar)) : zname(v.zone, ar);
      return '<div class="viol' + (v.sev === 'hi' ? ' hi' : '') + '" data-cam="' + v.cam + '">' +
        '<b><span class="vcode">' + v.code + '</span>' + (LF(v, 'what', ar)) +
        ' <em class="ex">' + L2(say, ar) + '</em></b>' +
        '<span>' + (S('ui.rule', ar)) + (LF(v, 'rule', ar)) + '</span>' +
        '<span>' + (S('ui.fix', ar)) + (LF(v, 'fix', ar)) + ' · ' + where +
        ' · <bdi>CAM ' + v.cam + '</bdi> · ' + (S('ui.standing-since', ar)) + '<bdi>' + hhmm(v.open) + '</bdi></span></div>';
    }).join('');
  }
  /* one line a lens can carry without giving up a whole panel to it */
  function violLine(t, ar, lensId) {
    var n = violsAt(t, lensId).length, c = violsClosed(t, lensId).length;
    return h4(S('ui.this-lens-s-own-standing-violations-click-to', ar)) +
      (n || c ? '' : '') + violHTML(t, ar, lensId) +
      (c ? '<p class="pgNote">' + S('ui.n-closed-today-under-this-lens', ar, { n: c }) + '</p>' : '');
  }

  /* ---------------- the recorder ---------------- */
  function recorderHTML(t, ar) {
    var R = T.site && T.site.recorder;
    if (!R) return empty('TBC');
    var cams = T.cameras ? T.cameras.list.length : 0, ch = 0;
    R.rooms.forEach(function (r) { ch += r.channels; });
    var clipsToday = (LY.clips || []).filter(function (c) { return c.min <= t; }).length + violsAt(t).length;
    var out = kpis(kpi(cams + ' / ' + ch, S('ui.cameras-on-channels', ar), css('run')),
                   kpi(R.retention_days + (S('ui.days', ar)), S('ui.retention', ar)),
                   kpi(R.storage_tb + ' TB', S('ui.storage', ar)),
                   kpi(clipsToday, S('ui.clips-today', ar)));
    out += h4((S('ui.where-it-is-recorded', ar)) + exTag(ar));
    out += R.rooms.map(function (r) {
      return evt(css('run'), (LF(r, 'name', ar)) + ' · ' + r.channels + (S('ui.ch', ar)), (LF(r, 'role', ar)) + ' · ' + R.resolution);
    }).join('');
    out += '<p class="pgNote">' + (LF(R, 'sync', ar)) + '</p>';
    return out;
  }

  /* ================================================================================
     LEAN, 5S AND KAIZEN
     17 Nov 2026 (Jamal): "we have not put anything to do with lean, kaizen or 5S in the model -
     put 5S under production and the rest in their right places, because I do not want to forget
     them. Make sure most of the parameters and the sections and the ideas are there, even if
     they need improving - the important thing is that they exist as a start."
     The split that matters, and the reason this is not one big example page:
       MEASURED, from the simulator, no new sensor needed - changeover and setup minutes,
                 waiting, breakdown, unlogged stopped time, tool and consumable waits, walk
                 hours, and the real CYCLE TIME of every station (run minutes per piece).
                 Changeover is the lean loss nobody meters and everybody pays for, so it is
                 this lens's headline and it has its own 30-day series (build_model.mjs).
       FROM THE MODEL - WIP standing on the floor, counted off the layout.
       EXAMPLE    - the 5S audit sheet, the kaizen register, TPM and standard-work counts, the
                 gemba log, and the takt DEMAND. They come from telmera/data/lean.json and
                 every panel that prints them says so.
       TBC       - overproduction, over-processing and unused skill. They need the order book,
                 the routing and a skills matrix. We say what each one needs rather than
                 inventing a number, and no figure here is ever per person.
     ================================================================================ */
  var SRC_LBL = { measured: 'ui.measured', model: 'ui.from-the-model',
                  example: 'ui.example', tbc: ['TBC', 'TBC'] };
  function srcTag(src, ar) { return ' <em class="ex">' + L2(SRC_LBL[src] || SRC_LBL.tbc, ar) + '</em>'; }

  /* every measured lean figure for minute t, in one pass */
  function leanBits(t) {
    var p = plant(t), f = t / DAY;
    var wait = (p.by['Waiting for material'] || 0) + (p.by['Waiting for QC'] || 0) +
               (p.by['Waiting for crane'] || 0) + (p.by['No operator'] || 0);
    var co = p.by['Changeover / setup'] || 0, bd = p.by.Breakdown || 0,
        un = p.by.Unlogged || 0, tool = p.by['Tool / consumable'] || 0;
    /* how many changeovers, not just how many minutes: the SMED question is the count */
    var coCount = 0;
    p.rows.forEach(function (r) {
      var rec = REC[r.id]; if (!rec) return;
      for (var i = 0; i < rec.segments.length; i++) {
        var sg = rec.segments[i]; if (sg[0] >= t) break;
        if (sg[3] === 'Changeover / setup') coCount++;
      }
    });
    var walk = (LY.manpower ? LY.manpower.walk_h * f : 0) * 60;
    var wip = LAY ? (LAY.props || []).filter(function (x) { return x.kind === 'panel'; }).length : 0;
    return { p: p, wait: wait, co: co, coCount: coCount, bd: bd, un: un, tool: tool,
             walk: walk, wip: wip, q: quality(t), lost: wait + co + bd + un + tool };
  }

  /* the 5S audit sheet, turned into something rankable */
  function fiveS() {
    if (!LN || !LN.fiveS || !LN.fiveS.zones) return null;
    var F = LN.fiveS, zs = F.zones, keys = Object.keys(zs), steps = F.steps || [], mx = (F.max || 5) * steps.length;
    var rows = keys.map(function (z) {
      return { zone: z, v: zs[z], tot: zs[z].reduce(function (a, x) { return a + x; }, 0), mx: mx };
    }).sort(function (a, b) { return a.tot - b.tot; });
    var byStep = steps.map(function (st, i) {
      var sum = 0; keys.forEach(function (z) { sum += zs[z][i] || 0; });
      return { st: st, avg: sum / keys.length, max: F.max || 5 };
    });
    var all = rows.reduce(function (a, r) { return a + r.tot; }, 0);
    return { rows: rows, byStep: byStep, pct: rows.length ? all / (rows.length * mx) : 0, mx: mx, n: rows.length, F: F };
  }
  function scoreColour(frac) { return frac >= 0.8 ? css('run') : frac >= 0.6 ? css('setup') : css('fault'); }

  /* 5S by section, weakest first - the only order an audit board is useful in */
  function fiveSPanel(ar, limit, zoneList) {
    var F = fiveS(); if (!F) return empty('TBC');
    var rows = F.rows.filter(function (r) { return !zoneList || zoneList.indexOf(r.zone) >= 0; });
    if (!rows.length) return empty(S('ui.no-audited-section-in-this-scope', ar));
    return rows.slice(0, limit || rows.length).map(function (r) {
      return bar(zname(r.zone, ar), r.tot / r.mx, r.tot + ' / ' + r.mx + ' · ' +
        r.v.map(function (x, i) { return (F.byStep[i] ? (LP(F.byStep[i].st, ar)).slice(0, 1) : '') + x; }).join(' ') ,
        scoreColour(r.tot / r.mx));
    }).join('');
  }
  /* the five S's themselves, averaged across the plant: WHICH S is the plant weak at.
     Sustain is almost always the low one, and that is the finding - the first three are a
     clean-up, the last two are a system. */
  function fiveSStepsPanel(ar) {
    var F = fiveS(); if (!F) return '';
    return F.byStep.map(function (b) {
      return bar((LP(b.st, ar)) + ' <em class="ex">' + b.st.jp + '</em>', b.avg / b.max, n1(b.avg) + ' / ' + b.max, scoreColour(b.avg / b.max));
    }).join('');
  }

  /* THE EIGHT WASTES, with the source of every line written on it */
  function wastePanel(t, ar) {
    var b = leanBits(t), W = (LN && LN.waste) || [];
    var val = { waiting: b.wait, changeover: b.co, breakdown: b.bd, unlogged: b.un, transport: b.walk };
    var mx = Math.max(1, b.wait, b.co, b.bd, b.un, b.walk);
    var timed = W.filter(function (w) { return val[w.id] !== undefined; });
    var other = W.filter(function (w) { return val[w.id] === undefined; });
    var out = timed.map(function (w) {
      return bar((LP(w, ar)) + srcTag(w.src, ar), val[w.id] / mx, dur(val[w.id], ar),
                 w.id === 'changeover' ? css('setup') : w.id === 'breakdown' ? css('fault') : w.id === 'unlogged' ? css('idle') : css('wait'));
    }).join('');

  /* ================= WHAT A CAMERA SEES =================
     16 Nov 2026 (Jamal): "I saw nothing to do with the cameras - how do you bring the real
     scene, where does it show and how."
     The camera view IS the real scene: the renderer puts the main camera exactly on the pole,
     at its real height, with the real lens angle, and draws the plant from there. What was
     missing is everything a camera system puts ON TOP of that picture - the recording frame,
     the stamp, and the boxes round what it has detected. detections() returns those boxes in
     WORLD space; app.js projects them to the screen, so a box sits on the thing itself.

     What is honest: the boxes are drawn round objects the model already knows are there. This
     is not vision inference and it is not claimed to be - the overlay says "model", and
     detection confidence is a fixed number per object, not a number that drifts to look alive. */
  function inFrame(cam, X, Z) {
    var dx = X - cam.pos.x, dz = Z - cam.pos.z, d = Math.hypot(dx, dz);
    if (d > cam.reach) return 0;
    if (!cam.down) {
      var da = Math.atan2(dx, dz) - cam.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) > cam.fov / 2) return 0;
    }
    return d;
  }
  function conf(seed) { var s = Math.sin(seed * 91.37) * 43758.5; return 0.86 + (s - Math.floor(s)) * 0.13; }

  /* Every detection carries a STABLE `key`. app.js tracks by that key, so the same person keeps
     the same box across samples instead of being thrown away and recreated whenever the sort
     order changes - which is what made the overlay flicker (Jamal, 16 Nov). The key is an index
     into the simulation, never a person's identity: it exists for the length of this page load
     and names nobody. */
  function detections(cam, t, ar) {
    var out = [], P = T.people;
    if (camSilent(cam.id, t)) return out;             /* a camera that is not reporting detects nothing */
    if (P && P.visible) P.agents.forEach(function (a, i) {
      if (a.gone) return;                                             /* off shift: not in anybody's frame */
      var X = T.px(a.x), Z = T.pz(a.y), d = inFrame(cam, X, Z);
      if (!d) return;
      if (a.kind === 'static' && a.yOff > 1) return;                  /* an upper-floor office post is behind a slab */
      out.push({ key: 'p' + i, kind: 'person', X: X, Y: (a.yOff || 0) + 0.9, Z: Z, w: 0.75, h: 1.8, d: d,
                 label: S('ui.person', ar), c: conf(i + 3), sev: 'ok' });
    });
    (T.forklifts || []).forEach(function (f, i) {
      var X = T.px(f.x), Z = T.pz(f.y), d = inFrame(cam, X, Z);
      if (!d) return;
      out.push({ key: 'f' + i, kind: 'truck', X: X, Y: 1.2, Z: Z, w: 2.4, h: 2.4, d: d,
                 label: S('ui.forklift', ar), c: conf(i + 11), sev: f.yielding ? 'warn' : 'ok',
                 note: f.yielding ? (S('ui.giving-way', ar)) : '' });
    });
    violsAt(t).forEach(function (v, i) {
      /* a following violation has no fixed centre - ask the model where it is this frame, and
         if the person it is attached to is not on the floor, there is nothing to draw */
      var c = (T.violations && T.violations.centre) ? T.violations.centre(v) : T.rectCentre(v.box);
      if (!c) return;
      var d = inFrame(cam, c.X, c.Z);
      if (!d && v.cam !== cam.id) return;
      out.push({ key: 'v' + v.id, kind: 'viol', X: c.X, Y: v.box.z / 2, Z: c.Z, w: Math.max(v.box.w, v.box.h), h: v.box.z, d: d || 1,
                 label: v.code, c: conf(i + 29), sev: v.sev === 'hi' ? 'hi' : 'warn',
                 note: LF(v, 'what', ar) });
    });
    EV().forEach(function (e, i) {
      if (e.cam !== cam.id || !(t >= e.min && t < e.min + (e.dur || 25))) return;
      var X = T.px(e.x), Z = T.pz(e.y);
      out.push({ key: 'e' + i, kind: 'event', X: X, Y: 1.1, Z: Z, w: 2.2, h: 2.2, d: inFrame(cam, X, Z) || 1,
                 label: S('ui.event', ar), c: conf(i + 47), sev: e.sev === 'hi' ? 'hi' : 'warn', note: evText(e, ar) });
    });
    /* a violation or an event outranks a person or a truck, and within a class the FAR one is
       drawn first so a near box sits on top. The order is stable because the key is. */
    var RANK = { viol: 0, event: 1, truck: 2, person: 3 };
    out.sort(function (a, b) { return (RANK[a.kind] - RANK[b.kind]) || (b.d - a.d); });
    return out;
  }

  function povHTML(cam, ar) {
    var t = day.t, dets = detections(cam, t, ar);

    var off = camSilent(cam.id, t);

      var via = silentAt(t).filter(function (d) { return d.affects && d.affects.indexOf(cam.id) >= 0; })[0];
      return '<div class="povK"><b class="hot">—</b><span>' + (S('ui.channel-not-reporting', ar)) + '</span></div>' +
        h4(S('ui.signal-lost', ar)) +
        evt(css('fault'), (S('ui.last-frame-at', ar)) + '<bdi>' + hhmm(off) + '</bdi>',
            (S('ui.silent-for', ar)) + dur(t - off, ar) +
            (via ? ' · ' + (S('ui.cause', ar)) + '<bdi>' + via.id + '</bdi> — ' + (LF(via, 'what', ar)) : '')) +
        '<p>' + (S('ui.what-you-see-is-the-scene-from-where-the-cam', ar)) + '</p>';
    }
    var people = dets.filter(function (d) { return d.kind === 'person'; }).length;
    var trucks = dets.filter(function (d) { return d.kind === 'truck'; }).length;
    var flags = dets.filter(function (d) { return d.sev !== 'ok'; });
    var R = T.site && T.site.recorder;
    /* WHERE THIS PICTURE COMES FROM.
       16 Nov 2026 (Jamal): "where did it come from, how do you bring the real scene, and how
       does it end up like this - I do not understand this part."
       Fair question, and the panel never answered it. It answers it now, first, in one line,
       with the mount it is standing on: the picture is the SAME plant model, drawn from the
       camera's own position at its own height and its own lens angle. Nothing is filmed and
       nothing is faked - the viewpoint moves onto the pole, that is the whole trick. */
    var spec = [];
    if (cam.pos) spec.push((S('ui.mounted-at', ar)) + '<bdi>' + (Math.round(cam.pos.y * 10) / 10) + ' m</bdi>');
    if (cam.fov) spec.push((S('ui.lens', ar)) + '<bdi>' + Math.round(cam.fov * 180 / Math.PI) + '°</bdi>');
    if (cam.reach) spec.push((S('ui.reach', ar)) + '<bdi>' + Math.round(cam.reach) + ' m</bdi>');
    spec.push(cam.down ? (S('ui.dome-looking-down', ar)) : (S('ui.fixed-bullet', ar)));
    var out = h4(S('ui.where-this-picture-comes-from', ar)) +
      '<p style="margin-top:2px">' + S('ui.pov-source-note', ar, { spec: spec.join(' · ') }) + '</p>' +
      '<div class="povK"><b><bdi>' + people + '</bdi></b><span>' + (S('ui.people-in-frame', ar)) + '</span>' +
              '<b><bdi>' + trucks + '</bdi></b><span>' + (S('ui.trucks', ar)) + '</span>' +
              (flags.length ? '<b class="hot"><bdi>' + flags.length + '</bdi></b><span>' + (S('ui.flagged', ar)) + '</span>' : '') + '</div>';
    if (flags.length) {
      out += '<h4>' + (S('ui.what-the-camera-is-flagging-now', ar)) + '</h4>';
      flags.slice(0, 3).forEach(function (f) {
        out += evt(f.sev === 'hi' ? css('fault') : css('setup'), f.label + (f.note ? ' — ' + f.note : ''), (S('ui.in-frame-now', ar)));
      });
    }
    var items = [];
    EV().forEach(function (e) { if (e.cam === cam.id && e.min <= t) items.push({ min: e.min, hot: e.sev === 'hi', txt: evText(e, ar) }); });
    (LY.clips || []).forEach(function (c) { if (c.cam === cam.id && c.min <= t) items.push({ min: c.min, hot: c.sev === 'hi', txt: nameOf(c.asset, ar) + ' — ' + reason(c.reason, ar) + ' (' + dur(c.dur, ar) + ')' }); });
    violsAt(t).forEach(function (v) { if (v.cam === cam.id) items.push({ min: v.open, hot: v.sev === 'hi', txt: v.code + ' — ' + (LF(v, 'what', ar)) }); });
    items.sort(function (a, b) { return b.min - a.min; });
    out += '<h4>' + (S('ui.latest-this-camera-recorded', ar)) + '</h4>';
    if (!items.length) out += empty(cam.indoor ? (S('ui.no-clip-so-far', ar)) : (S('ui.perimeter-camera-no-event-today', ar)));
    items.slice(0, 3).forEach(function (it) { out += evt(it.hot ? css('fault') : css('setup'), it.txt, '<bdi>' + hhmm(it.min) + '</bdi>'); });
    if (R) out += '<p>' + S('ui.recording-note', ar, { r: R.resolution, d: R.retention_days, s: ar ? R.sync_ar : R.sync }) + '</p>';
    out += '<p>' + (S('ui.the-boxes-are-drawn-round-objects-the-model-', ar)) + '</p>';
    return out;
  }

  /* ================= THE LIVE BOARD =================
     16 Nov 2026 (Jamal): "I only found out by accident that clicking a camera brings up what is
     in front of it. I want something easier - something you press and it brings you the camera
     WITH the event. Something more organised."
     Finding a camera by hunting for a 60 cm pole in a 120 x 80 m plot is not a way in. A camera
     system's way in is a LIST: what is happening, newest and worst first, each line naming the
     channel that saw it, and one press away from that channel. The cameras themselves are under
     it, grouped and with the dead ones shown as dead, because the second question after "what
     happened" is always "what else can I look at".
     Every row carries data-cam or data-m, which is the same contract the dashboard, the alert
     strip and the advisor already use - app.js's follow() opens it. No new wiring. */
  /* ================= THE ALERT INBOX =================
     25 Nov 2026, Jamal: "and I want you to organise the matter of the alerts, the notifications."

     The ENGINEERING was already written and had been since 12 Nov - 01_PRODUCT/
     FOUNDATION_REGISTRY.md §4, one of the three declared tables: ONE owner · N informed · ONE
     escalation, a threshold on everything except safety, the money flag travelling with the
     event rather than making a second one. What was missing is that NONE OF IT WAS VISIBLE. The
     live board was sorted by KIND - violations, then events, then machines - and a manager does
     not ask "which category is this". He asks ONE question: WHAT NEEDS ME. So the board is now
     sorted by accountability, which is what the table was always for:

        NEEDS YOU          this lens is the single owner. It must act.
        FOR INFORMATION    this lens is informed. No action is expected of it.
        CLOSED TODAY       the loop closing, because a board that only lists what is wrong is a
                           complaints board.

     Two rules are enforced here rather than described:
       - NOTHING FIRES INSTANTLY EXCEPT SAFETY. An item younger than its class's `fires_after`
         is counted and pushed to NOBODY. Noise is this engine's only failure mode: a role that
         gets more than a handful of actionable alerts a shift stops reading all of them.
       - AN ALERT WITH NO OWNER IS A LOG LINE. It is counted, stored, and never pushed. This is
         the rule that stops the product becoming a notification spammer.
     And one that is enforced in two places and must agree in both: MAINTENANCE NEVER SEES A
     RIYAL. The money flag is on the EVENT, so the same 61-minute stop reads "SAR 2,400 lost" to
     operations and "61 minutes, breakdown" to the technician. One event, two renderings. */
  function policyOf(id) {
    var P = T.data.alert_policy;
    if (!P) return null;
    for (var i = 0; i < P.classes.length; i++) if (P.classes[i].id === id) return P.classes[i];
    return null;
  }
  /* is this class switched on in the model that is running? In MACHINE there are no cameras, so
     there are no camera events to route - the inbox must not invent them. */
  function classLive(c) {
    if (!c) return false;
    if (!T.pkg) return true;
    var order = ['machine', 'motion', 'advisor'], now = order.indexOf(T.pkg.id());
    if (order.indexOf(c.model) > now) return false;
    if (c.tier === 'pro' && T.pkg.id() === 'machine' && T.pkg.tier() !== 'pro') return false;
    return true;
  }
  function mcost(id) {
    if (!D) return 0;
    for (var i = 0; i < D.machines.length; i++) if (D.machines[i].id === id) return D.machines[i].cost || 0;
    return 0;
  }
  function chanNames(c, ar) {
    var CH = (T.data.alert_policy || {}).channels || {};
    return (c.channel || []).map(function (k) { return CH[k] ? (ar ? CH[k].ar : CH[k].en) : k; }).join(' · ');
  }
  function lensName(id, ar) {
    var all = (T.data.lenses && T.data.lenses.lenses) || [];
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return LP(all[i], ar);
    return id;
  }

  function inbox(t, lensId) {
    var out = { mine: [], info: [], closed: [], held: 0, logged: 0 };
    function push(clsId, owner, informed, o) {
      var c = policyOf(clsId);
      if (!classLive(c)) return;
      var age = t - o.min;
      if (age < (c.fires_after || 0)) { out.held++; return; }     /* below its threshold */
      if (!owner) { out.logged++; return; }                       /* no owner: a log line */
      var item = {
        c: c, sev: o.sev, code: o.code, title: o.title, sub: o.sub, min: o.min, age: age,
        owner: owner, informed: informed || [], attr: o.attr || '',
        esc: c.escalate_after !== undefined && age >= c.escalate_after,
        money: c.carries_money ? (o.money || 0) : 0
      };
      if (owner === lensId) out.mine.push(item);
      else if (item.informed.indexOf(lensId) >= 0) out.info.push(item);
    }

    /* 1 - the machines. The class is the reason: a breakdown is the maintenance manager's, a
       stop nobody explained is the supervisor's, and neither is the other's. */
    liveAlerts(t).forEach(function (a) {
      /* THE SAME STOP, A DIFFERENT SENTENCE, AND THAT IS THE PRODUCT DIFFERENCE.
         An unexplained stop in MACHINE Basic is "no reason recorded" - nobody was ever asked, so
         nobody is at fault and the alert says exactly that. The identical stop in Pro is "the
         stop reason was not pressed": there IS a tablet, somebody was asked, and the alert goes
         to the tablet as well as the screen. One event, two renderings - the same rule as the
         money flag, applied to the cause instead of the cost. */
      var pro = T.pkg && (T.pkg.id() !== 'machine' || T.pkg.tier() === 'pro');
      var cls = !reasonsKnown() ? 'stop-unlogged'
              : a.r === 'Breakdown' ? 'breakdown'
              : a.r === 'Unlogged' ? (pro ? 'reason-missing' : 'stop-unlogged')
              : 'stop-logged';
      var c = policyOf(cls);
      push(cls, c && c.owner, c && c.informed, {
        sev: cls === 'breakdown' ? 'hi' : 'md',
        code: a.id,                       /* the title is resolved per language in inboxRow */
        min: a.min, money: (t - a.min) / 60 * mcost(a.id),
        attr: ' data-m="' + a.id + '"', mach: a.id, reasonCode: a.r
      });
    });

    /* 2 - the standing violations. The OWNER COMES FROM THE ITEM: site_data.js already declares
       `owners` per violation and that is the one place it is written. An aggregation written
       twice will drift, and this project has paid for that lesson once already. */
    violsAt(t).forEach(function (v) {
      var own = (v.owners && v.owners[0]) || null;
      var inf = (v.owners || []).slice(1);
      push('violation', own, inf, { sev: v.sev, code: v.code, min: v.open, attr: ' data-cam="' + v.cam + '"', viol: v });
    });

    /* 3 - the safety and security layer, which exists only once there are cameras */
    var KM = (T.data.alert_policy || {}).event_kinds || {};
    EV().forEach(function (e) {
      if (!(t >= e.min && t < e.min + (e.dur || 25))) return;
      var cls = KM[e.kind] || 'safety-event', c = policyOf(cls);
      push(cls, c && c.owner, c && c.informed, { sev: e.sev, code: '', min: e.min, attr: ' data-cam="' + e.cam + '"', ev: e });
    });

    out.closed = violsClosed(t).filter(function (v) {
      return !v.owners || v.owners.indexOf(lensId) >= 0;
    });
    function sev(x) { return x.sev === 'hi' ? 0 : x.sev === 'md' ? 1 : 2; }
    out.mine.sort(function (a, b) { return (b.esc - a.esc) || (sev(a) - sev(b)) || (a.min - b.min); });
    out.info.sort(function (a, b) { return sev(a) - sev(b) || (a.min - b.min); });
    return out;
  }

  /* the text of one inbox line. money is rendered ONLY where the lens holds it. */
  function inboxRow(it, ar, money) {
    var txt = it.title || '';
    if (it.viol) txt = (LF(it.viol, 'what', ar));
    else if (it.ev) txt = evText(it.ev, ar);
    else if (it.mach) txt = S(it.c.title, ar) + ' · ' + nameOf(it.mach, ar);
    var sub = '<bdi>' + hhmm(it.min) + '</bdi> · ' + dur(it.age, ar);
    if (money && it.money >= 1) sub += ' · <bdi>SAR ' + num(it.money) + '</bdi> ' + S('ui.lost-so-far', ar);
    if (it.c.escalate_after !== undefined) {
      sub += ' · ' + (it.esc
        ? S('ui.escalated-to', ar, { who: lensName(it.c.escalate_to, ar) })
        : S('ui.escalates-to-in', ar, { who: lensName(it.c.escalate_to, ar), min: dur(it.c.escalate_after - it.age, ar) }));
    }
    sub += ' · ' + S('ui.by-channel', ar) + ': ' + chanNames(it.c, ar);
    return feedRow(it.sev === 'hi' || it.esc, it.code, txt, sub, it.attr);
  }

  function inboxHTML(t, ar, lensId, money) {
    var b = inbox(t, lensId), out = '';
    out += '<div class="fdH">' + S('ui.needs-you', ar) + '<i>' + b.mine.length + '</i></div>';
    out += b.mine.length ? b.mine.map(function (it) { return inboxRow(it, ar, money); }).join('')
                         : empty(S('ui.nothing-needs-you', ar));
    out += '<div class="fdH">' + S('ui.for-information', ar) + '<i>' + b.info.length + '</i></div>';
    out += b.info.length ? b.info.map(function (it) { return inboxRow(it, ar, money); }).join('')
                         : empty(S('ui.nothing-for-information', ar));
    if (b.closed.length) {
      out += '<div class="fdH">' + S('ui.closed-today-2', ar) + '<i>' + b.closed.length + '</i></div>';
      b.closed.forEach(function (v) {
        out += '<button class="fd done" data-cam="' + v.cam + '"><em>✓ ' + v.code + '</em>' +
          '<span class="fdT">' + (LF(v, 'what', ar)) + '</span>' +
          '<span class="fdS">' + (S('ui.stood-for', ar)) + dur(v.close - v.open, ar) +
          ' · <bdi>' + hhmm(v.open) + '</bdi> → <bdi>' + hhmm(v.close) + '</bdi></span></button>';
      });
    }
    /* what the engine deliberately did NOT push, said out loud - a threshold the user cannot see
       reads as a system that missed something */
    var qui = [];
    if (b.held) qui.push(S('ui.waiting-threshold', ar, { n: b.held }));
    if (b.logged) qui.push(b.logged + ' ' + S('ui.not-pushed-no-owner', ar));
    if (qui.length) out += '<div class="fdQuiet">' + qui.join(' · ') + '</div>';
    return out;
  }

  function feedRow(hot, code, title, sub, attr) {
    return '<button class="fd' + (hot ? ' hot' : '') + '"' + attr + '>' +
      (code ? '<em>' + code + '</em>' : '') + '<span class="fdT">' + title + '</span>' +
      '<span class="fdS">' + sub + '</span></button>';
  }
  function feedHTML(t, ar, lensId, money) {
    /* THE BOARD LEADS WITH ACCOUNTABILITY, NOT WITH CATEGORY. The kind-ordered sections that
       used to be here are still below, because "which machines are down" is a real question -
       but it is the second question. The first is what needs this person. */
    var out = inboxHTML(t, ar, lensId, money), n = 0;
    out += '<div class="fdSplit">' + S('ui.and-by-kind', ar) + '</div>';

    /* 1 - standing violations: the lens's own first, then the rest, each with its camera */
    var vs = violsAt(t).slice().sort(function (a, b) {
      var ao = !a.owners || a.owners.indexOf(lensId) >= 0, bo = !b.owners || b.owners.indexOf(lensId) >= 0;
      return (bo - ao) || ((b.sev === 'hi') - (a.sev === 'hi')) || (a.open - b.open);
    });
    out += '<div class="fdH">' + (S('ui.standing-violations', ar)) + '<i>' + vs.length + '</i></div>';
    if (!vs.length) out += empty(S('ui.nothing-standing-right-now', ar));
    vs.forEach(function (v) {
      var mine = !v.owners || v.owners.indexOf(lensId) >= 0;
      out += feedRow(v.sev === 'hi', v.code, (LF(v, 'what', ar)),
        (S('ui.standing-since', ar)) + '<bdi>' + hhmm(v.open) + '</bdi> · ' + dur(t - v.open, ar) +
        ' · <bdi>CAM ' + v.cam + '</bdi>' + (mine ? '' : ' · ' + (S('ui.not-this-lens', ar))),
        ' data-cam="' + v.cam + '"');
      n++;
    });

    /* 1b - and the ones that were CLEARED. A board that only ever lists what is wrong is a
       complaints board; the loop closing is the thing worth showing. */
    var closed = violsClosed(t);
    if (closed.length) {
      out += '<div class="fdH">' + (S('ui.closed-today', ar)) + '<i>' + closed.length + '</i></div>';
      closed.forEach(function (v) {
        out += '<button class="fd done" data-cam="' + v.cam + '"><em>✓ ' + v.code + '</em>' +
          '<span class="fdT">' + (LF(v, 'what', ar)) + '</span>' +
          '<span class="fdS">' + (S('ui.stood-for', ar)) + dur(v.close - v.open, ar) +
          ' · <bdi>' + hhmm(v.open) + '</bdi> → <bdi>' + hhmm(v.close) + '</bdi> · <bdi>CAM ' + v.cam + '</bdi></span></button>';
      });
    }

    /* 2 - events open right now, then the ones already logged today */
    var liveEv = EV().filter(function (e) { return t >= e.min && t < e.min + (e.dur || 25); });
    var pastEv = eventsTo(t).filter(function (e) { return liveEv.indexOf(e) < 0; }).slice(-6).reverse();
    out += '<div class="fdH">' + (S('ui.events', ar)) + '<i>' + liveEv.length + (S('ui.open', ar)) + '</i></div>';
    if (!liveEv.length && !pastEv.length) out += empty(S('ui.no-event-today-so-far', ar));
    liveEv.forEach(function (e) {
      out += feedRow(e.sev === 'hi', S('ui.open-2', ar), evText(e, ar),
        '<bdi>' + hhmm(e.min) + '</bdi> · ' + zname(e.zone, ar) + ' · <bdi>CAM ' + e.cam + '</bdi>', ' data-cam="' + e.cam + '"');
      n++;
    });
    pastEv.forEach(function (e) {
      out += feedRow(false, '', evText(e, ar),
        '<bdi>' + hhmm(e.min) + '</bdi> · ' + zname(e.zone, ar) + ' · <bdi>CAM ' + e.cam + '</bdi>', ' data-cam="' + e.cam + '"');
    });

    /* 3 - stops that are open on the floor: no camera, but the machine card is the proof */
    var live = liveAlerts(t);
    if (live.length) {
      out += '<div class="fdH">' + (S('ui.open-stops-2', ar)) + '<i>' + live.length + '</i></div>';
      live.slice(0, 6).forEach(function (a) {
        out += feedRow(a.r === 'Breakdown', '', nameOf(a.id, ar) + ' — ' + reason(a.r, ar),
          (S('ui.since', ar)) + '<bdi>' + hhmm(a.min) + '</bdi> · ' + dur(t - a.min, ar), ' data-m="' + a.id + '"');
      });
    }

    /* 4 - every channel, grouped, with the dead ones shown as dead - and only if there ARE
       channels: in model A no camera was installed, so there is no channel list to show */
    var cams = camsOn() ? ((T.cameras && T.cameras.list) || []) : [];
    var groups = [[S('ui.yard-and-perimeter', ar), cams.filter(function (c) { return !c.indoor; })],
                  [S('ui.hall-floor', ar), cams.filter(function (c) { return c.indoor; })]];
    groups.forEach(function (gp) {
      if (!gp[1].length) return;
      var dead = gp[1].filter(function (c) { return camSilent(c.id, t); }).length;
      out += '<div class="fdH">' + gp[0] + '<i>' + gp[1].length + (dead ? ' · ' + dead + (S('ui.down', ar)) : '') + '</i></div>';
      out += '<div class="fdCams">' + gp[1].map(function (c) {
        var off = camSilent(c.id, t);
        return '<button class="fdc' + (off ? ' off' : '') + '" data-cam="' + c.id + '" title="' + (LF(c, 'label', ar)) + '">' +
          '<b>' + c.id + '</b><span>' + (off ? (S('ui.no-signal', ar)) : (LF(c, 'label', ar))) + '</span></button>';
      }).join('') + '</div>';
    });
    return out;
  }

  /* ---------------- safety events on the floor ---------------- */
  var markers = [], pulse = 0;
  function buildEventMarkers() {
    /* The markers are part of the MODEL VIEW. dash.js is also the number engine for the phone
       app, which has no scene until its plant view is opened (01_PRODUCT/APP_PLAN.md stage C),
       so a missing scene is a normal state here and not an error. In the model T.scene always
       exists, so this changes nothing there. */
    if (typeof THREE === 'undefined' || !T.scene) return;   /* markers stay empty; stepEventMarkers walks an empty list */
    var g = new THREE.Group(); g.name = 'events'; T.scene.add(g);
    var geo = new THREE.RingGeometry(0.9, 1.3, 28);
    EV().forEach(function (e) {
      var m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: ST.fault, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide }));
      m.rotation.x = -Math.PI / 2; m.position.set(T.px(e.x), 0.07, T.pz(e.y)); m.visible = false; m.renderOrder = 3;
      g.add(m); markers.push({ e: e, m: m });
    });
    T.groups.events = g;
  }
  function stepEventMarkers(dt) {
    pulse += dt;
    markers.forEach(function (k) {
      var live = day.t >= k.e.min && day.t < k.e.min + (k.e.dur || 25);
      k.m.visible = live && T.groups.events.visible;
      if (k.m.visible) { var s = 1 + (pulse * 0.8 % 1) * 1.8; k.m.scale.set(s, s, 1); k.m.material.opacity = 0.95 - (pulse * 0.8 % 1) * 0.8; }
    });
  }

  /* ---------------- alert strip ---------------- */
  /* Chips are graded, not uniformly dim (Jamal, 16 Nov: "the alert colours should be clearer").
     Three severities, each with its own fill, its own border and its own glyph - so the chip is
     readable at a glance and still readable with no colour vision at all:
       sev1 STOP      a standing high violation or a breakdown   solid red
       sev2 ATTENTION a standing medium violation, a safety event amber band
       sev3 LOGGED    an ordinary logged stop                    its state colour, quiet */
  function alertsHTML(t, ar, max) {
    var live = liveAlerts(t), out = '', n = 0;
    violsAt(t).forEach(function (v) {
      out += '<button class="al sev' + (v.sev === 'hi' ? '1' : '2') + '" data-cam="' + v.cam + '">' +
        '<i>' + (v.sev === 'hi' ? '⛔' : '⚠') + '</i><b>' + v.code + '</b>' + (LF(v, 'what', ar)) + '</button>';
      n++;
    });
    EV().forEach(function (e) {
      if (t >= e.min && t < e.min + (e.dur || 25)) {
        out += '<button class="al sev' + (e.sev === 'hi' ? '1' : '2') + '" data-cam="' + e.cam + '"><i>' + (e.sev === 'hi' ? '⛔' : '⚠') + '</i>' +
          evText(e, ar) + ' · <bdi>CAM ' + e.cam + '</bdi></button>';
        n++;
      }
    });
    live.slice(0, max).forEach(function (a) {
      var k = rkind(a.r), hot = k === 'fault';
      out += '<button class="al ' + (hot ? 'sev1' : 'sev3') + '" data-m="' + a.id + '">' +
        (hot ? '<i>⛔</i>' : '<i class="dotI" style="background:' + css(k) + '"></i>') +
        nameOf(a.id, ar) + ' · ' + reason(a.r, ar) + ' · <bdi>' + dur(t - a.min, ar) + '</bdi></button>';
      n++;
    });
    if (live.length > max) out += '<span class="al more">+' + (live.length - max) + '</span>';
    return out || '<span class="al ok"><i>✓</i>' + (S('ui.no-open-alert-and-no-standing-violation', ar)) + '</span>';
